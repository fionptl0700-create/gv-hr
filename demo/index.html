<style>

      --ink:#E7EDE8; --ink-soft:#9DABA3; --ink-faint:#6C7A72; --line:#2A342E;
      --brand:#66AC8F; --brand-ink:#0E1310; --brand-soft:#1D2B24;
      --sidebar:#12352A; --sidebar-ink:#E7F1EC;
      --data:#E8975A;
      --good:#5FB98C; --good-bg:#16231C;
      --warn:#D8A441; --warn-bg:#2A2213;

  .login { max-width:380px; margin:8vh auto 0; }

<script>
/* ===================================================================
   綠谷國際 人資考勤系統 — 互動 Demo（前端單檔，資料存記憶體）
   特休(週年制) / 加班費 / 月薪試算 計算與正式版 TypeScript 邏輯一致
   =================================================================== */

let TODAY = new Date();                         // 實際今天（頁面若跨過午夜未關閉，render() 會自動校正，見 refreshToday()）
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
/* 頁面可能開著跨過午夜：每次重繪前檢查日期是否變了，變了就用新的「現在」取代 TODAY，
   避免打卡／考勤把已經是隔天的操作誤判成前一天。 */
function refreshToday(){
  const now = new Date();
  if (ymd(now) !== ymd(TODAY)) TODAY = now;
}
const curMonth = () => ymd(TODAY).slice(0,7);   // 例：2026-09
const fmtD = s => { const d=new Date(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const fmtT = s => { const d=new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
/* 打卡當下的 GPS 座標（若瀏覽器有取得並允許）→ 一個純連結，點開用 Google 地圖看位置；不含任何金鑰、不呼叫外部 API */
const gpsLink = p => (p && p.lat!=null) ? `<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" title="準確度約 ${Math.round(p.acc||0)} 公尺">📍 查看</a>` : '<span class="muted">—</span>';
const money = n => 'NT$ ' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 特休（勞基法 §38，週年制） ---------- */
function monthsOfService(hire,asOf){
  let m=(asOf.getFullYear()-hire.getFullYear())*12+(asOf.getMonth()-hire.getMonth());
  if(asOf.getDate()<hire.getDate()) m--;
  return Math.max(0,m);
}
const yearsOfService=(h,a)=>Math.floor(monthsOfService(h,a)/12);
function annualLeaveDays(hire,asOf){
  const m=monthsOfService(hire,asOf), y=Math.floor(m/12);
  if(m<6)return 0; if(m<12)return 3;
  if(y<2)return 7; if(y<3)return 10; if(y<5)return 14; if(y<10)return 15;
  return Math.min(15+(y-9),30);
}
function anniversaryPeriod(hire,asOf){
  const m=monthsOfService(hire,asOf);
  const six=new Date(hire); six.setMonth(six.getMonth()+6);
  const first=new Date(hire); first.setFullYear(first.getFullYear()+1);
  let ps,pe;
  if(m<6){ ps=new Date(hire); pe=new Date(six); pe.setDate(pe.getDate()-1); }
  else if(m<12){ ps=new Date(six); pe=new Date(first); pe.setDate(pe.getDate()-1); }
  else { const y=Math.floor(m/12);
    ps=new Date(hire); ps.setFullYear(ps.getFullYear()+y);
    pe=new Date(hire); pe.setFullYear(pe.getFullYear()+y+1); pe.setDate(pe.getDate()-1); }
  return { start:ps, end:pe, granted:m<6?0:annualLeaveDays(hire,ps),
           daysLeft:Math.ceil((pe-asOf)/86400000) };
}
/* 下一次特休給假日與日數（§38 週年制：滿 6 個月給 3 日，其後每個到職週年重新給） */
function nextAnnualGrant(hire,asOf){
  const m=monthsOfService(hire,asOf);
  if(m<6){ const d=new Date(hire); d.setMonth(d.getMonth()+6); return { date:d, days:3, first:true }; }
  const y=Math.floor(m/12)+1;
  const d=new Date(hire); d.setFullYear(d.getFullYear()+y);
  return { date:d, days:annualLeaveDays(hire,d), first:false };
}

/* ---------- 加班費（§24）／上限（§32） ----------
   平日每小時工資額 = 月工資 ÷ 240（月工資＝本薪＋按月固定發給之工資性津貼；膳食津貼不列入）。 */
function wageBaseMonthly(e){ return (+e.salary||0) + (+e.mgrAllow||0) + (+e.otherAllow||0) + (+e.meal||0); }
const hourlyOf = m => m/240;

/* §24Ⅰ 平日延長工時：前 2 小時 ×1⅓、第 3 小時起 ×1⅔ */
function workdayOtPay(r,h){ return Math.min(h,2)*r*(4/3) + Math.max(h-2,0)*r*(5/3); }
/* §24Ⅱ/Ⅲ 休息日出勤：前 2 小時 ×1⅓、第 3–8 小時 ×1⅔、第 9–12 小時 ×2⅔ */
function restDayOtPay(r,h){
  return Math.min(h,2)*r*(4/3)
       + Math.min(Math.max(h-2,0),6)*r*(5/3)
       + Math.min(Math.max(h-8,0),4)*r*(8/3);
}
/* §39 國定假日出勤：8 小時內加發一日工資；逾 8 小時依 §24Ⅰ */
function holidayOtPay(r,h){ return r*8 + workdayOtPay(r, Math.max(h-8,0)); }

function overtimePay(monthlyWage, hours, dayType){
  const r = hourlyOf(monthlyWage);
  if (dayType==='REST_DAY') return Math.round(restDayOtPay(r,hours));
  if (dayType==='HOLIDAY' || dayType==='OFF_DAY') return Math.round(holidayOtPay(r,hours));
  return Math.round(workdayOtPay(r,hours));
}
/* 分段明細（供畫面顯示各段加成倍率） */
function overtimeBreakdown(monthlyWage, hours, dayType){
  const r = hourlyOf(monthlyWage), seg = [];
  const push = (h,mult,note) => { if (h>0.001) seg.push({ hours:+h.toFixed(2), mult, amount:Math.round(h*r*mult), note }); };
  if (dayType==='REST_DAY'){
    push(Math.min(hours,2), 4/3, '休息日前 2 小時 ×1⅓');
    push(Math.min(Math.max(hours-2,0),6), 5/3, '休息日第 3–8 小時 ×1⅔');
    push(Math.min(Math.max(hours-8,0),4), 8/3, '休息日第 9–12 小時 ×2⅔');
  } else if (dayType==='HOLIDAY' || dayType==='OFF_DAY'){
    push(8, 1, '國定假日出勤加發 1 日（8 小時 ×1）');
    push(Math.min(Math.max(hours-8,0),2), 4/3, '逾 8 小時之前 2 小時 ×1⅓');
    push(Math.max(hours-10,0), 5/3, '逾 10 小時 ×1⅔');
  } else {
    push(Math.min(hours,2), 4/3, '平日前 2 小時 ×1⅓');
    push(Math.max(hours-2,0), 5/3, '平日第 3 小時起 ×1⅔');
  }
  return { hourly:Math.round(r), seg, total:seg.reduce((s,x)=>s+x.amount,0) };
}
function fmtMult(m){
  if (Math.abs(m-4/3)<1e-6) return '1⅓';
  if (Math.abs(m-5/3)<1e-6) return '1⅔';
  if (Math.abs(m-8/3)<1e-6) return '2⅔';
  if (Math.abs(m-1)<1e-6)   return '1';
  return m.toFixed(2);
}
function otLimit(mins,agreement){
  const cap=(agreement?54:46)*60, ratio=mins/cap;
  let level='OK';
  if(mins>cap)level='BREACH'; else if(ratio>=1)level='ALERT'; else if(ratio>=.8)level='WARN';
  return { cap, ratio, level };
}

/* 2026 國定假日（放假日）— 供加班日別判定與請假日數扣除；請以人事行政總處公告為準，可於正式版維護 */
const TW_HOLIDAYS = new Set([
  '2026-01-01',                                                   // 元旦
  '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20',// 春節（除夕～初四）
  '2026-02-27','2026-02-28',                                      // 和平紀念日
  '2026-04-03','2026-04-04','2026-04-06',                         // 兒童節暨民族掃墓節
  '2026-05-01',                                                   // 勞動節
  '2026-06-19',                                                   // 端午節
  '2026-09-25',                                                   // 中秋節
  '2026-10-09','2026-10-10',                                      // 國慶日
]);
function twDayType(dateStr){
  if (TW_HOLIDAYS.has(dateStr)) return 'HOLIDAY';
  const w = new Date(dateStr+'T00:00').getDay();
  if (w===0) return 'OFF_DAY';    // 週日：例假
  if (w===6) return 'REST_DAY';   // 週六：休息日
  return 'WORKDAY';
}
const DT_LABEL = { WORKDAY:'平日', REST_DAY:'休息日', HOLIDAY:'國定假日', OFF_DAY:'例假' };

/* ---------- 月薪試算 ----------
   綠谷：無全勤獎金；伙食津貼免稅上限 3,000／月。
   台灣月薪制：日薪一律 = 月薪 ÷ 30。
   當月部分在職（到職／離職落在月中）：
     · 本薪、固定津貼、勞保自付 ＝ 各該月額 ÷ 30 × 在職曆日數（上限為全額）
     · 健保自付：保費按月計收，只要當月在職即收「整月」，不因月中到職／離職按日
   加班費、出差津貼、遲到早退／請假扣款皆按實際發生，不比例。 */
function computePayroll(i){
  const wb = i.wageBase || i.monthlySalary;            // 加班／請假／遲到扣款基準（月工資 ÷ 240）
  const hr=wb/240, dw=wb/30;
  const dim = i.daysInMonth || 30;
  const ed  = (i.employedDays==null) ? dim : Math.max(0, i.employedDays);
  const partial = ed < dim;
  const pro = v => partial ? Math.min(Math.round(v||0), Math.round((v||0)/30*ed)) : (v||0);   // 月額 ÷ 30 × 在職日，上限全額
  const pTag = partial ? `（在職 ${ed} 日 · 月額÷30）` : '';
  const pNote = v => partial ? `${Math.round(v)} ÷ 30 × ${ed} 日` : undefined;

  const earnings=[], deductions=[], flags=[];
  earnings.push({ label:`本薪${partial?pTag:'（月薪）'}`, amount:pro(i.monthlySalary), note:pNote(i.monthlySalary) });
  if(i.meal>0)       earnings.push({ label:`伙食津貼${partial?'（比例）':''}`, amount:pro(i.meal), note: partial?pNote(i.meal):'免稅上限 3,000／月' });
  if(i.mgrAllow>0)   earnings.push({ label:`主管津貼${partial?'（比例）':''}`, amount:pro(i.mgrAllow), note:pNote(i.mgrAllow) });
  if(i.otherAllow>0) earnings.push({ label:`其他津貼${partial?'（比例）':''}`, amount:pro(i.otherAllow), note:pNote(i.otherAllow) });
  if(i.overtimePay>0) earnings.push({ label:'加班費（本月核定）', amount:Math.round(i.overtimePay) });
  if(i.perDiem>0) earnings.push({ label:`出差津貼（${i.perDiemDays} 日）`, amount:Math.round(i.perDiem), note:`每日 ${i.pdRate||''}` });

  if(i.unpaidHours>0) deductions.push({ label:`事假／無薪假扣薪（${i.unpaidHours} 小時）`, amount:Math.round(hr*i.unpaidHours), note:`每小時工資額 ${Math.round(hr)}（月工資 ÷ 240）× ${i.unpaidHours}h` });
  if(i.halfHours>0)   deductions.push({ label:`病假／生理假扣薪（${i.halfHours} 小時，折半發給）`, amount:Math.round(hr*i.halfHours*0.5), note:`${Math.round(hr)} × ${i.halfHours}h × 50%（普通傷病假 30 日內工資折半）` });
  if(i.absentDays>0)  deductions.push({ label:`曠職扣薪（${i.absentDays} 日）`, amount:Math.round(dw*i.absentDays), note:`日工資 ${Math.round(dw)}（月工資 ÷ 30）× ${i.absentDays}（曠工當日工資不發）` });
  if(i.lateMin>0)     deductions.push({ label:`遲到扣薪（${i.lateMin} 分鐘）`, amount:Math.round(hr*i.lateMin/60), note:'僅按未提供勞務時間比例扣發，未另立罰款（勞動部函釋）' });
  if(i.earlyMin>0)    deductions.push({ label:`早退扣薪（${i.earlyMin} 分鐘）`, amount:Math.round(hr*i.earlyMin/60), note:'僅按未提供勞務時間比例扣發' });
  if(i.laborSelf>0)   deductions.push({ label:`勞保＋就保費（自付）${partial?`（在職 ${ed} 日）`:''}`, amount:pro(i.laborSelf), note: partial?`月額 ${Math.round(i.laborSelf)} ÷ 30 × ${ed} 日`:undefined });
  if(i.healthSelf>0)  deductions.push({ label:`健保費（自付）${partial?'（整月，不按日）':''}`, amount:Math.round(i.healthSelf), note: partial?'健保保費按月計收，當月在職即收整月':undefined });

  if(partial) flags.push(`當月部分在職 ${ed} 日：本薪、固定津貼、勞保按「月額 ÷ 30 × 在職日」；健保收整月`);

  const gross=earnings.reduce((s,e)=>s+e.amount,0);
  const totDed=deductions.reduce((s,d)=>s+d.amount,0);
  return { hourly:Math.round(hr), daily:Math.round(dw), employedDays:ed, daysInMonth:dim, partial, earnings, deductions, gross, totDed, net:gross-totDed, flags };
}

/* 補休時數池（§32-1：補休期限 6 個月，屆期未休應改發加班費） */
function compTimePool(empId, asOf){
  asOf = asOf || TODAY;
  let active = 0, expiring = 0, expired = 0;
  DB.overtime.filter(o=>String(o.emp)===String(empId) && o.status==='APPROVED' && o.comp==='COMP_TIME' && !o.compPaidOut).forEach(o=>{
    const exp = new Date(o.date+'T00:00'); exp.setMonth(exp.getMonth()+6);
    if (exp < asOf) { expired += o.hours; }
    else { active += o.hours; if ((exp - asOf)/86400000 <= 30) expiring += o.hours; }
  });
  const used = DB.leaves.filter(l=>String(l.emp)===String(empId) && l.type==='COMP_OFF' && ['APPROVED','PENDING'].includes(l.status))
    .reduce((s,l)=>s + (l.hours||0), 0);
  return { active, expiring, expired, used, avail: Math.max(0, Math.round((active - used)*100)/100) };
}
/* 補休逾 6 個月未休（§32-1）：找出「在這個月到期」且尚未結算過的加班換休時數，
   依原加班當時的日別／工資基準試算應改發之加班費，供薪資試算／確認時自動列入應發項目。
   confirmPayslip() 確認時會把這些紀錄標記 compPaidOut，避免下個月重複結算。 */
function expiredCompPayout(empId, ym, wageBase){
  const [yr, mo] = ym.split('-').map(Number);
  const mStart = new Date(yr, mo-1, 1), mEnd = new Date(yr, mo, 0, 23, 59, 59);
  let hours = 0, pay = 0; const ids = [];
  DB.overtime.filter(o=>String(o.emp)===String(empId) && o.status==='APPROVED' && o.comp==='COMP_TIME' && !o.compPaidOut).forEach(o=>{
    const exp = new Date(o.date+'T00:00'); exp.setMonth(exp.getMonth()+6);
    if (exp >= mStart && exp <= mEnd){
      hours += o.hours;
      pay += overtimePay(o.wageBase || wageBase, o.hours, o.dayType);
      ids.push(o.id);
    }
  });
  return { hours: Math.round(hours*100)/100, pay: Math.round(pay), ids };
}

/* =========================  雲端資料庫（Artifact db）  =========================
   資料存在 Claude 平台，改版不會被覆蓋。db 不可用時自動退回「離線示範模式」。 */
let CDB = null, OFFLINE = false, DB_ERR = '';
function unfreeze(v){ try { return JSON.parse(JSON.stringify(v)); } catch(e){ return v; } }
function applyState(s){
  s = unfreeze(s) || {};   // db 回傳的文件是唯讀（凍結）的，必須深拷貝成可修改物件，否則編輯／簽核會丟 "read only property"
  EMP.length = 0; (s.emp||[]).forEach(e=>EMP.push(e));
  SEQ = s.seq || 100;
  const d = s.db || {};
  ['leaves','overtime','trips','outings','wfh','att','payslips','audit'].forEach(k=>{ DB[k].length=0; (d[k]||[]).forEach(x=>DB[k].push(x)); });
}
function collectState(){
  return { emp: EMP.map(x=>({...x})), seq: SEQ,
    db: { leaves:DB.leaves, overtime:DB.overtime, trips:DB.trips, outings:DB.outings, wfh:DB.wfh, att:DB.att, payslips:DB.payslips, audit:DB.audit } };
}
function seedOffline(){ if(OFFLINE) return; OFFLINE = true; const s = buildSeed(); applyState(s); DB.punches.length=0; s.db.punches.forEach(p=>DB.punches.push(p)); }
function withTimeout(p, ms, label){
  return Promise.race([ Promise.resolve(p),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'操作')+' 逾時 '+(ms/1000)+'s')), ms)) ]);
}
async function hydrate(){
  try { CDB = (window.claude && claude.use) ? await withTimeout(claude.use('db'), 11000, 'use(db)') : null; }
  catch(e){ CDB = null; DB_ERR = 'use(db): ' + ((e&&e.message)||e); }
  if (!CDB){ if(!DB_ERR) DB_ERR = 'claude.use("db") 回傳 null（未授權或此檢視不支援）'; seedOffline(); return; }
  let core;
  try { core = await withTimeout(CDB.doc('gv/core').get(), 10000, 'get(gv/core)'); }
  catch(e){ DB_ERR = 'get(gv/core): ' + ((e&&e.code)||(e&&e.message)||e); seedOffline(); return; }
  if (!core.exists){
    const seed = buildSeed();
    applyState({ emp:seed.emp, seq:seed.seq, db:seed.db });
    try {
      await withTimeout(CDB.doc('gv/core').set(collectState()), 10000, 'seed set(gv/core)');
      const pm = {}; seed.db.punches.forEach(p=>{ const m=p.ts.slice(0,7); (pm[m]=pm[m]||[]).push(p); });
      for (const m in pm) await withTimeout(CDB.doc('gv/punch_'+m).set({ list: pm[m] }), 10000, 'seed set(punch)');
    } catch(e){ DB_ERR = 'seed set(): ' + ((e&&e.code)||(e&&e.message)||e); OFFLINE = true; }
  } else {
    applyState(core.data());
  }
  try { await withTimeout(loadPunchesCloud(), 10000, 'loadPunches'); } catch(e){ /* 打卡稍後由 onSnapshot 補 */ }
  // 即時同步：別人改了 → 重新載入並重繪
  try {
    CDB.doc('gv/core').onSnapshot(snap=>{
      if (!snap.exists || snap.metadata.hasPendingWrites || !window.__gvBooted || _pendingSave) return;
      applyState(snap.data()); render();
    });
  } catch(e){}
}
async function loadPunchesCloud(){
  DB.punches.length = 0;
  const months = [curMonth(), prevMonth()];
  for (const m of months){
    try { const s = await CDB.doc('gv/punch_'+m).get(); if (s.exists) (unfreeze(s.data().list)||[]).forEach(p=>DB.punches.push(p)); } catch(e){}
    try { CDB.doc('gv/punch_'+m).onSnapshot(sn=>{ if(!sn.exists||sn.metadata.hasPendingWrites||!window.__gvBooted) return;
      const others = DB.punches.filter(p=>p.ts.slice(0,7)!==m); DB.punches.length=0;
      others.forEach(p=>DB.punches.push(p)); (unfreeze(sn.data().list)||[]).forEach(p=>DB.punches.push(p));
      render(); }); } catch(e){}
  }
}

let _saveT = null, _pendingSave = false;
function setSave(txt, tip){ const el=document.getElementById('saveStatus'); if(el){ el.textContent=txt; el.title=tip||''; el.style.color = /失敗|離線/.test(txt)?'var(--bad)':'var(--ink-faint)'; } }
function persistErr(where, e){
  const code = (e && e.code) ? e.code : String(e && e.message ? e.message : e);
  console.error('[persist ' + where + ']', e);
  setSave('⚠ 儲存失敗：' + code, (e && e.message) || '');
}

async function downloadFile(filename, text, mime){
  try {
    const dl = (window.claude && claude.use) ? await claude.use('downloads') : null;
    if (dl){ await dl.save({ filename, data: text }); return true; }
  } catch(e){}
  try {
    const blob = new Blob(['﻿'+text], {type:(mime||'text/plain')+';charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    return true;
  } catch(e){ setSave('⚠ 此環境無法下載檔案'); return false; }
}

function reportSummaryCSV(ym){

  const rows = EMP.map(m=>{
    const a = monthAttendance(m.id, ym);

    return [m.no, m.name, DEPTS[m.dept], a.workDays, punchDays.size, a.workedHours, a.outingHours, a.late, a.early, a.missing, a.absent, leaveDays, otH];
  });
  return csvRows([['綠谷國際 月出勤彙總', ym],[], head, ...rows]);
}

/* 首頁「貼心小提醒」：把個人相關、值得主動提醒的小事收攏成一份友善清單（沒事時整塊都不顯示） */
function dashboardTips(e){
  const tips = [];
  const today = ymd(TODAY);
  const todaysPunches = DB.punches.filter(p=>String(p.emp)===String(e.id) && String(p.ts).slice(0,10)===today);
  const outTrail = todaysPunches.filter(p=>p.type==='OUTING_OUT'||p.type==='OUTING_IN').sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  const stillOut = outTrail.length && outTrail[outTrail.length-1].type==='OUTING_OUT';
  if (stillOut){
    tips.push({ icon:'🚪', text:`你目前顯示「外出中」（${fmtT(outTrail[outTrail.length-1].ts)} 外出），回來後別忘了打「外出返回」喔。`, href:'#/punch' });
  }
  const dt = twDayType(today);
  const onLeaveToday = DB.leaves.find(l=>String(l.emp)===String(e.id)&&l.status==='APPROVED'&&l.start<=today&&l.end>=today&&l.days>=1);
  const onTripToday  = DB.trips.find(t=>String(t.emp)===String(e.id)&&t.status==='APPROVED'&&t.start<=today&&t.end>=today);
  const onWfhToday   = DB.wfh.find(w=>String(w.emp)===String(e.id)&&w.status==='APPROVED'&&w.date===today);
  const hasInToday   = todaysPunches.some(p=>p.type==='IN');
  const nowMin = TODAY.getHours()*60 + TODAY.getMinutes();
  if (dt==='WORKDAY' && !onLeaveToday && !onTripToday && !onWfhToday && !hasInToday && nowMin>=555){
    tips.push({ icon:'🕘', text:'還沒看到你今天的上班打卡，別忘了打卡喔！', href:'#/punch' });
  }
  const att = monthAttendance(e.id, curMonth());
  if (att.missing>0){
    tips.push({ icon:'❗', text:`這個月有 ${att.missing} 天忘記打下班卡，記得跟管理員說一聲幫忙補登喔。`, href:'#/attendance' });
  }
  const pool = compTimePool(e.id);
  if (pool.expiring>0) tips.push({ icon:'🔁', text:`你有 ${pool.expiring} 小時補休將於 30 天內到期，記得安排時間用掉喔。`, href:'#/leave/new' });
  if (pool.expired>0)  tips.push({ icon:'🔁', text:`你有 ${pool.expired} 小時補休已超過 6 個月沒用，依規定會改發加班費，下次結算薪資時會自動列入。`, href:'#/payroll' });
  const per = anniversaryPeriod(new Date(e.hire), TODAY);
  const bal = leaveBalance(e.id, 'ANNUAL');
  if (per.granted>0 && bal.left>0){
    const daysLeft = Math.ceil((per.end - TODAY)/86400000);
    if (daysLeft>=0 && daysLeft<=30) tips.push({ icon:'🏝️', text:`你的特休將於 ${fmtD(per.end)}（還剩 ${daysLeft} 天）到期，還有 ${bal.left} 天沒休，記得安排一下喔。`, href:'#/leave/new' });
  }
  if (isApprover(e.id)){
    const n = pendingApprovalsFor(e.id).length;
    if (n>0) tips.push({ icon:'✅', text:`有 ${n} 筆單據等你簽核，別忘了抽空處理喔。`, href:'#/approvals' });
  }
  DB.trips.filter(t=>String(t.emp)===String(e.id) && t.status==='APPROVED').forEach(t=>{
    const days = Math.ceil((new Date(t.start+'T00:00') - TODAY)/86400000);
    if (days>=0 && days<=3) tips.push({ icon:'✈️', text:`你有出差將於 ${fmtD(t.start)} 出發（${esc(t.dest||'')}），記得提前準備喔。`, href:'#/trip' });
  });
  return tips;
}

const WORK_START = 540, WORK_END = 1080;                 // 09:00 / 18:00（分鐘）
const LUNCH_START = 720, LUNCH_END = 780;                // 12:00–13:00 休息時間（不計工時、不給薪）
const FULL_DAY_MIN = (LUNCH_START - WORK_START) + (WORK_END - LUNCH_END);   // 09:00–12:00 ＋ 13:00–18:00 ＝ 480 分＝ 8 小時
const hm2min = s => { const [h,m] = String(s).split(':').map(Number); return h*60 + (m||0); };
/* 實際工時（分鐘）＝出勤落在「09:00–12:00」與「13:00–18:00」兩段內的時間，12:00–13:00 自動扣除 */
function workedMinutes(inMin, outMin){
  const seg = (a,b) => Math.max(0, Math.min(outMin,b) - Math.max(inMin,a));
  return seg(WORK_START, LUNCH_START) + seg(LUNCH_END, WORK_END);
}
/* 當日「外出／外出返回」配對（依時間先後一對一配對；外出後未打返回卡則 in=null） */
function outingIntervals(dayPunches){
  const outs = dayPunches.filter(p=>p.type==='OUTING_OUT');
  const ins  = dayPunches.filter(p=>p.type==='OUTING_IN');
  const pairs = []; let ii = 0;
  outs.forEach(o=>{
    while (ii<ins.length && ins[ii].ts <= o.ts) ii++;
    if (ii<ins.length){ pairs.push({ out:o.ts, in:ins[ii].ts }); ii++; }
    else pairs.push({ out:o.ts, in:null });
  });
  return pairs;
}

/* 逐日考勤：一律以「打卡」為準自動計算，交叉比對已核准的請假／出差／遠距與國定假日。
   DB.att 只放主管的人工修正（emp+date），若存在則覆蓋當日自動結果。 */
function monthAttendance(empId, ym){
  const [Y, Mo] = ym.split('-').map(Number);
  const dim = new Date(Y, Mo, 0).getDate();
  const todayStr = ymd(TODAY);
  const rows = [];
  // 該員工「開始被打卡系統追蹤」的日期＝其史上第一筆打卡日；在此之前的應出勤日不視為曠職（無資料）
  const myPunchDates = DB.punches.filter(p=>String(p.emp)===String(empId)).map(p=>String(p.ts).slice(0,10)).sort();
  const trackFrom = myPunchDates[0] || null;

  for (let n=1; n<=dim; n++){
    const date = `${ym}-${pad(n)}`;
    if (date > todayStr) break;                          // 未來日不列
    const dt = twDayType(date);                          // WORKDAY / REST_DAY / HOLIDAY / OFF_DAY
    const manual = DB.att.find(a=>String(a.emp)===String(empId) && a.date===date && a.manual===true);
    const ps = DB.punches.filter(p=>String(p.emp)===String(empId) && String(p.ts).slice(0,10)===date)
                         .sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
    const pin  = ps.find(p=>p.type==='IN');
    const pout = [...ps].reverse().find(p=>p.type==='OUT');
    const leave = DB.leaves.find(l=>String(l.emp)===String(empId) && l.status==='APPROVED' && l.start<=date && l.end>=date);
    const trip  = DB.trips.find(t=>String(t.emp)===String(empId) && t.status==='APPROVED' && t.start<=date && t.end>=date);
    const wfh   = DB.wfh.find(w=>String(w.emp)===String(empId) && w.status==='APPROVED' && w.date===date);

    let row = { emp:empId, date, dayType:dt, in:'—', out:'—', late:0, early:0, worked:0, status:'NORMAL', anomalies:[] };

    if (manual){
      Object.assign(row, manual, { dayType:dt });
    } else if (dt!=='WORKDAY' && !pin){
      row.status = dt==='HOLIDAY' ? 'HOLIDAY' : 'OFF';
    } else if (leave && leave.days>=1){
      row.status = 'LEAVE';
    } else if (trip){
      row.status = 'TRIP';
    } else if (wfh){
      row.status = 'WFH'; row.in = '遠距'; row.out = '遠距';
    } else if (pin){
      row.in = fmtT(pin.ts);
      const inMin = hm2min(row.in);
      row.late = Math.max(0, inMin - WORK_START);
      if (pout){
        row.out = fmtT(pout.ts);
        const outMin = hm2min(row.out);
        row.early = Math.max(0, WORK_END - outMin);
        row.worked = workedMinutes(inMin, outMin);        // 已扣 12:00–13:00 休息
      } else if (date < todayStr){
        row.anomalies.push('MISSING_PUNCH');
      }
      // 外出／外出返回：從當日工時扣除外出時段（與上下班時段重疊部分），並列出時段供查核
      const outPairs = outingIntervals(ps);
      if (outPairs.length){
        let outMinTotal = 0, openOuting = false;
        outPairs.forEach(op=>{
          if (op.in) outMinTotal += workedMinutes(hm2min(fmtT(op.out)), hm2min(fmtT(op.in)));
          else openOuting = true;
        });
        if (outMinTotal>0){ row.worked = Math.max(0, row.worked - outMinTotal); row.outMin = outMinTotal; }
        row.outings = outPairs.map(op=> op.in ? `${fmtT(op.out)}–${fmtT(op.in)}` : `${fmtT(op.out)}–（未打返回卡）`);
        if (openOuting && date < todayStr) row.anomalies.push('OUTING_NO_RETURN');
      }
      // 當日有已核准的部分假（半日或按時）：該時段屬合法請假，不重複認定遲到／早退（扣薪由假單處理）
      if (leave){ row.late = 0; row.early = 0; row.leaveNote = leave.byHour ? `含 ${leave.hours} 小時${LT(leave.type).name}` : `含半日${LT(leave.type).name}`; }
      if (row.anomalies.includes('MISSING_PUNCH')) row.status = 'MISSING';   // 缺卡≠曠職：分開的狀態標籤，避免跟真正沒來上班混淆
      else if (row.late>0){ row.status='LATE'; row.anomalies.push('LATE'); }
      else if (row.early>0){ row.status='EARLY'; row.anomalies.push('EARLY_LEAVE'); }
      else row.status = pout ? 'NORMAL' : 'OPEN';
      if (row.late>0 && !row.anomalies.includes('LATE')) row.anomalies.push('LATE');
      if (row.early>0 && !row.anomalies.includes('EARLY_LEAVE')) row.anomalies.push('EARLY_LEAVE');
    } else {
      // 應出勤、無假無差、且完全沒打卡
      if (date >= todayStr) row.status = 'OPEN';
      else if (!trackFrom || date < trackFrom) row.status = 'NODATA';   // 尚未納入打卡追蹤 → 不算曠職
      else { row.status='ABSENT'; row.anomalies.push('ABSENT'); }
    }
    rows.push(row);
  }

  let late=0, early=0, absent=0, missing=0, workedMin=0, outMin=0; const anomalies=[];
  rows.forEach(a=>{
    late += a.late||0; early += a.early||0; workedMin += a.worked||0; outMin += a.outMin||0;
    if (a.anomalies.includes('ABSENT')) absent++;
    if (a.anomalies.includes('MISSING_PUNCH')) missing++;
    a.anomalies.forEach(c=>anomalies.push({ code:c, date:a.date }));
  });
  const workDays = rows.filter(r=>r.dayType==='WORKDAY').length;
  return { rows, late, early, absent, missing, anomalies, workDays,
    workedHours: Math.round(workedMin/60*10)/10, outingHours: Math.round(outMin/60*10)/10 };
}
const hrs = min => (min/60).toFixed(2).replace(/\.?0+$/,'');   // 480→"8"、463→"7.72"

function adminAddPunch(empId, date, endDate, type, hm){
  if (!isAdmin()) return;
  const tgt = emp(empId); if (!tgt){ flash='⚠️ 找不到員工'; render(); return; }
  if (!date || !hm){ flash='⚠️ 請填日期與時間'; render(); return; }
  const dates = [];
  if (endDate && endDate > date){
    let d = new Date(date+'T00:00'); const end = new Date(endDate+'T00:00');
    while (d <= end){ const ds = ymd(d); if (twDayType(ds)==='WORKDAY') dates.push(ds); d.setDate(d.getDate()+1); }
  } else dates.push(date);
  let added = 0, skipped = 0;
  dates.forEach(ds=>{
    const dup = DB.punches.some(p=>String(p.emp)===String(tgt.id) && p.type===type && String(p.ts).slice(0,10)===ds);
    if (dup){ skipped++; return; }
    DB.punches.push({ id:'p'+(++SEQ), emp:tgt.id, type, ts:`${ds}T${hm}`, editedBy:state.uid });
    added++;
  });
  const months = new Set(dates.map(d=>d.slice(0,7)));
  months.forEach(m=>savePunchMonth(m));
  pushAudit('新增打卡', `${tgt.no} ${tgt.name}`, `${type} @ ${hm}，${date}${dates.length>1?`～${endDate}（僅平日）`:''}，新增 ${added} 筆${skipped?`、略過 ${skipped} 筆（已有紀錄）`:''}`);
  flash = dates.length>1
    ? `🛠️ 已為 ${tgt.name} 批次新增 ${added} 筆打卡${skipped?`（另有 ${skipped} 天已有紀錄，自動略過）`:''}`
    : `🛠️ 已為 ${tgt.name} 新增打卡：${fmtD(date).slice(5)} ${hm}`;
  render();
}

/* 某人某假別的本期額度 / 已用 / 簽核中 / 可用（ANNUAL 走週年制，其餘走年度 quota；null = 不設固定額度） */
function leaveBalance(empId, code, asOf){
  asOf = asOf || TODAY;
  const e = emp(empId), t = LT(code);
  let quota, winStart, winEnd;
  if (code==='ANNUAL'){
    const per = anniversaryPeriod(new Date(e.hire), asOf);
    quota = per.granted; winStart = per.start; winEnd = per.end;
  } else {
    quota = (t.quota==null ? null : t.quota);
    winStart = new Date(asOf.getFullYear(),0,1); winEnd = new Date(asOf.getFullYear(),11,31,23,59,59);
  }
  const hit = l => String(l.emp)===String(empId) && l.type===code
    && ['APPROVED','PENDING'].includes(l.status)
    && new Date(l.start) >= winStart && new Date(l.start) <= winEnd;
  const used = DB.leaves.filter(l=>hit(l) && l.status==='APPROVED').reduce((s,l)=>s+l.days,0);
  const pend = DB.leaves.filter(l=>hit(l) && l.status==='PENDING').reduce((s,l)=>s+l.days,0);
  return { quota, used, pend, left: quota==null ? null : Math.round((quota-used-pend)*10)/10 };
}
function balHintHtml(code){
  const t = LT(code);
  const wage = t.paid>=1 ? '工資照給' : t.paid===0.5 ? '工資折半發給' : '不給工資（不扣全勤／無薪）';
  if (code==='COMP_OFF'){
    const p = compTimePool(state.uid);
    const cls = p.avail<=0 ? 'bad' : p.expiring>0 ? 'warn' : 'good';
    return `<div class="banner" style="align-items:center"><span>🔁</span><div>補休以「已核准加班（換休）」時數扣抵　·　<span class="badge ${cls}">可補休 ${p.avail} 小時</span>　·　簽核中／已用 ${p.used} 小時${p.expiring?`　·　⚠️ ${p.expiring} 小時將於 30 日內到期`:''}${p.expired?`　·　${p.expired} 小時已逾 6 個月（應改發加班費）`:''}</div></div>`;
  }
  const b = leaveBalance(state.uid, code);
  if (b.quota==null)
    return `<div class="banner"><span>📅</span><div>「${t.name}」：${wage}。本假別依法令規則辦理，<b>未設固定年度額度</b>（例：特休依年資、產假／公傷病假依事由）。</div></div>`;
  const cls = b.left<=0 ? 'bad' : b.left<=1 ? 'warn' : 'good';
  return `<div class="banner" style="align-items:center"><span>📅</span><div>「${t.name}」本${code==='ANNUAL'?'週年期':'年度'}額度 <b>${b.quota} 日</b>　·　已核 ${b.used} 日　·　簽核中 ${b.pend} 日　·　<span class="badge ${cls}">可用 ${b.left} 日</span>　·　工資：${wage}</div></div>`;
}

/* ---- 簽核 ---- */
function pendingApprovalsFor(uid){
  const out=[];
  const scan=(arr,kind)=>arr.forEach(x=>{
    if(x.status!=='PENDING')return;
    const idx=x.steps.findIndex(s=>s.st==='PENDING');
    if(idx>=0 && String(x.steps[idx].by)===String(uid)) out.push({kind,x,step:idx});
  });
  scan(DB.leaves,'LEAVE'); scan(DB.overtime,'OVERTIME'); scan(DB.trips,'TRIP'); scan(DB.outings,'OUTING'); scan(DB.wfh,'WFH');
  return out;
}
V.approvals = () => {
  if (!isApprover(me().id)) return `<div class="panel"><p class="muted">您目前不在任何簽核流程中。</p></div>`;
  const pend = pendingApprovalsFor(me().id);
  const desc = ({kind,x})=>{
    if(kind==='LEAVE'){ const t=LT(x.type);
      const qty = x.byHour ? `${x.hours} 小時` : (x.days===0.5 ? '半日' : `${x.days} 日`);
      return {who:emp(x.emp).name,title:'📝 請假單：'+t.name,lines:[
        `期間 ${fmtD(x.start)}${x.start!==x.end?'–'+fmtD(x.end):''}　${qty}`,`工資 ${paidLabel(t.paid)}`,
        x.reason?`事由：${x.reason}`:''],
        attachHtml: x.attach ? (x.attachUrl?`附件：<a href="${esc(x.attachUrl)}" target="_blank" rel="noopener">📎 ${esc(x.attach)}</a>`:`附件：📎 ${esc(x.attach)}（僅存檔名）`) : '附件：（未附）' }; }
    if(kind==='OVERTIME'){ const bd = x.comp==='PAY' ? overtimeBreakdown(x.wageBase||wageBaseMonthly(emp(x.emp)), x.hours, x.dayType) : null;
      return {who:emp(x.emp).name,title:'⏱️ 加班單',lines:[
      `${fmtD(x.date)}（${DT_LABEL[x.dayType]||x.dayType}）${x.start}–${x.end}　共 ${x.hours} 小時`,
      `補償：${x.comp==='PAY'?'加班費，試算 '+money(x.estPay):'補休（1:1）'}`,
      bd&&bd.seg.length?`加成：${bd.seg.map(s=>`${s.hours}h ×${fmtMult(s.mult)} = ${money(s.amount)}`).join('；')}`:'',
      `事由：${x.reason}`]}; }
    if(kind==='TRIP') return {who:emp(x.emp).name,title:'✈️ 出差單（'+(x.scope==='OVERSEAS'?'國外':'國內')+'）',lines:[
      `${fmtD(x.start)}–${fmtD(x.end)} · ${x.dest}`,`事由：${x.purpose}`,
      x.cost!=null?`預估差旅費 ${money(x.cost)}`:'',
      x.perDiem?`出差津貼 ${x.days} 日 × ${money(x.pdRate)} = ${money(x.perDiem)}`:'']};
    if(kind==='OUTING') return {who:emp(x.emp).name,title:'🚪 外出單',lines:[`${fmtD(x.date)} ${x.start}–${x.end} · ${x.location}`,`事由：${x.purpose}`]};
    return {who:emp(x.emp).name,title:'🏠 遠距工作單',lines:[`${fmtD(x.date)} · ${x.location||'—'}`,`工作項目：${x.plan}`]};
  };
  const cards = pend.length ? pend.map(p=>{
    const d=desc(p);
    return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="row" style="gap:8px"><b>${d.who}</b><span class="badge info">${d.title}</span><span class="muted" style="font-size:11px">第 ${p.step+1} 關</span></div>
        <ul style="margin:8px 0 0;padding-left:18px;color:var(--ink-soft)">${d.lines.filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}${d.attachHtml?`<li>${d.attachHtml}</li>`:''}</ul></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:210px">
        <input class="field" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink)" placeholder="簽核意見（選填）" id="cmt-${p.kind}-${p.x.id}">
        <div class="row"><button class="btn primary sm" style="flex:1" data-act="decide" data-kind="${p.kind}" data-id="${p.x.id}" data-do="APPROVED">✓ 核准</button>
        <button class="btn bad sm" style="flex:1" data-act="decide" data-kind="${p.kind}" data-id="${p.x.id}" data-do="REJECTED">✕ 駁回</button></div>
      </div></div></div>`;
  }).join('') : `<div class="panel"><p class="muted">目前沒有待簽核項目 🎉</p></div>`;
  return `<div class="stack"><h2 style="font-size:16px">✅ 待簽核 ${pend.length} 筆</h2>${cards}</div>`;
};

/* ---- 月薪試算（管理員限定） ---- */
function leaveHoursByPay(empId,ym){
  let unpaid=0,half=0,full=0;
  DB.leaves.filter(l=>l.emp===empId&&l.status==='APPROVED'&&l.start.startsWith(ym)).forEach(l=>{
    const t=LT(l.type);
    if(t.paid===0) unpaid+=l.hours; else if(t.paid===0.5) half+=l.hours; else full+=l.hours;
  });
  return {unpaid,half,full};
}

  if (!isAdmin()) return `<div class="panel"><p class="muted">🔒 「薪資試算」僅管理員可使用。</p></div>`;

  const eid=+q.get('e')||EMP[0].id, yr=+q.get('y')||TODAY.getFullYear(), mo=+q.get('m')||(TODAY.getMonth()+1);
  const e=emp(eid), ym=`${yr}-${pad(mo)}`;
  const att=monthAttendance(eid,ym), lh=leaveHoursByPay(eid,ym);
  const wb = wageBaseMonthly(e);
  const otPay=DB.overtime.filter(o=>String(o.emp)===String(eid)&&o.status==='APPROVED'&&o.comp==='PAY'&&o.date.startsWith(ym))
    .reduce((s,o)=>s + overtimePay(o.wageBase||wb, o.hours, o.dayType), 0);
  const mTrips=DB.trips.filter(t=>String(t.emp)===String(eid)&&t.status==='APPROVED'&&t.start.startsWith(ym));
  const perDiem=mTrips.reduce((s,t)=>s+(t.perDiem||0),0);
  const perDiemDays=mTrips.reduce((s,t)=>s+(t.days||0),0);

  // 當月在職曆日數（到職／離職落在月中 → 比例計薪）
  const dim = new Date(yr, mo, 0).getDate();                 // 當月天數
  const mStart = new Date(yr, mo-1, 1), mEnd = new Date(yr, mo-1, dim);
  const hireD = new Date(e.hire + 'T00:00:00');

  let employedDays = dim;
  if (hireD > mEnd || (leaveD && leaveD < mStart)) {
    employedDays = 0;                                        // 該月尚未到職 / 已離職
  } else {
    const s = hireD > mStart ? hireD : mStart;

      <button class="btn primary" type="submit">🧮 試算</button>

    <div class="tiles">
      <div class="tile"><div class="k">💵 月工資基準</div><div class="v">${money(wb).replace('NT$ ','')}</div><div class="hint">每小時 ${money(r.hourly)} · 每日 ${money(r.daily)}</div></div>
      <div class="tile"><div class="k">📆 當月在職天數</div><div class="v">${r.employedDays}<span style="font-size:12px"> 日</span></div><div class="hint">${r.partial?`本薪／津貼／勞保 × ${r.employedDays}÷30 ＝ ${(r.employedDays/30*100).toFixed(1)}%`:'整月在職，全額'}</div></div>

        <div class="kv total"><span>應扣合計</span><span class="amt">− ${money(r.totDed)}</span></div>

    </div>
    <div class="panel row" style="justify-content:space-between"><b style="font-size:15px">💰 實發薪資（Net Pay）</b><b style="font-size:22px;color:var(--data)">${money(r.net)}</b></div>
    <div class="panel">
      ${slip
        ? `<div class="row" style="justify-content:space-between;align-items:center">
             <div><span class="badge good">✅ 已確認</span> ${e.name}／${yr} 年 ${mo} 月薪酬明細　<span class="subnote">實發 ${money(slip.net)}　·　${fmtD(slip.confirmedAt)} 由 ${(emp(slip.confirmedBy)||{name:'—'}).name} 確認</span></div>

/* 確認 = 把當下試算結果定版成該員該月薪酬明細（快照，之後不隨資料異動） */
function confirmPayslip(eid, ym){
  if (!isAdmin()) return;
  const e = emp(eid); if (!e){ flash='⚠️ 找不到員工，無法確認'; render(); return; }
  const [yr, mo] = ym.split('-').map(Number);
  const att=monthAttendance(eid,ym), lh=leaveHoursByPay(eid,ym), wb=wageBaseMonthly(e);
  const otPay=DB.overtime.filter(o=>String(o.emp)===String(eid)&&o.status==='APPROVED'&&o.comp==='PAY'&&o.date.startsWith(ym)).reduce((s,o)=>s+overtimePay(o.wageBase||wb,o.hours,o.dayType),0);
  const mTrips=DB.trips.filter(t=>String(t.emp)===String(eid)&&t.status==='APPROVED'&&t.start.startsWith(ym));
  const dim=new Date(yr,mo,0).getDate();
  const mStart=new Date(yr,mo-1,1), mEnd=new Date(yr,mo-1,dim);
  const hireD=new Date(e.hire+'T00:00:00'), leaveD=e.leaveDate?new Date(e.leaveDate+'T00:00:00'):null;
  let ed=dim;
  if (hireD>mEnd || (leaveD && leaveD<mStart)) ed=0;
  else { const s=hireD>mStart?hireD:mStart, en=(leaveD&&leaveD<mEnd)?leaveD:mEnd; ed=Math.round((en-s)/86400000)+1; }
  const healthActive = !(leaveD && leaveD < mEnd) || !!e.healthDepartFull;
  const r=computePayroll({ monthlySalary:e.salary, wageBase:wb, meal:e.meal, mgrAllow:e.mgrAllow, otherAllow:e.otherAllow,
    daysInMonth:dim, employedDays:ed, lateMin:att.late, earlyMin:att.early, absentDays:att.absent,
    unpaidHours:lh.unpaid, halfHours:lh.half, overtimePay:otPay,
    perDiem:mTrips.reduce((s,t)=>s+(t.perDiem||0),0), perDiemDays:mTrips.reduce((s,t)=>s+(t.days||0),0), pdRate:perDiemRate(e.role),
    laborSelf:e.laborSelf, healthSelf: healthActive ? e.healthSelf : 0 });
  const idx = DB.payslips.findIndex(p=>String(p.emp)===String(e.id) && p.ym===ym);
  // 補休逾 6 個月未休（§32-1）：只有第一次確認才結算＋標記 compPaidOut；重新確認時延用當初金額
  // （避免因記錄已標記過而在第二次確認時消失，同一筆逾期補休不會被結算兩次）
  let compOut = { hours:0, pay:0, ids:[] };
  if (idx < 0){
    compOut = expiredCompPayout(eid, ym, wb);
  }
  const priorCompLine = idx>=0 ? (DB.payslips[idx].earnings||[]).find(x=>x.label && x.label.includes('補休逾期改發加班費')) : null;
  if (compOut.pay > 0){
    r.earnings.push({ label:`補休逾期改發加班費（${compOut.hours} 小時，已逾 6 個月）`, amount:compOut.pay, note:'依原加班當時之日別與工資基準試算' });
    r.gross += compOut.pay; r.net += compOut.pay;
    compOut.ids.forEach(id=>{ const o=DB.overtime.find(x=>String(x.id)===String(id)); if(o) o.compPaidOut=true; });
  } else if (priorCompLine){
    r.earnings.push({ ...priorCompLine });
    r.gross += priorCompLine.amount; r.net += priorCompLine.amount;
  }
  const rec = { emp:e.id, ym, confirmedAt:new Date().toISOString(), confirmedBy:state.uid,

/* ---- 自行送出之申請：查詢 / 可否修改 / 取消 ---- */
const REQ_ARR = { leave:'leaves', overtime:'overtime', trip:'trips', outing:'outings', wfh:'wfh' };
function findMyReq(kind, id){
  return (DB[REQ_ARR[kind]]||[]).find(r=>String(r.id)===String(id) && String(r.emp)===String(state.uid));
}
function editableReq(rec){
  return !!rec && rec.status==='PENDING' && (rec.steps||[]).every(s=>s.st==='PENDING');
}
function tripKindOf(id){
  if ((DB.trips||[]).some(t=>String(t.id)===String(id)))  return 'trip';
  if ((DB.outings||[]).some(o=>String(o.id)===String(id))) return 'outing';
  if ((DB.wfh||[]).some(w=>String(w.id)===String(id)))    return 'wfh';
  return null;
}
function cancelReq(kind, id){
  const rec = findMyReq(kind, id);
  if (!rec) return errMsg('找不到申請');
  if (!['PENDING','APPROVED'].includes(rec.status)) return;
  const was = rec.status;
  rec.status = 'CANCELLED';
  (rec.steps||[]).forEach(s=>{ if(s.st==='PENDING') s.st='CANCELLED'; });
  const K={leave:'請假',overtime:'加班',trip:'出差',outing:'外出',wfh:'遠距'}[kind]||kind;
  pushAudit('取消申請', `${(me()||{name:'?'}).name} 的${K}單`, `原狀態 ${was}`);
  saveAll(); flash='已取消申請'; render();
}
/* 打卡：盡量夾帶 GPS 座標（純瀏覽器定位 API，免費、不呼叫任何外部服務／不需金鑰）。
   使用者若拒絕定位權限、瀏覽器不支援、或 5 秒內沒有回應，一律照樣完成打卡（不因為沒有 GPS 而卡住）。 */
function recordPunch(type, label){
  const finish = (lat, lng, acc) => {
    const now = new Date();
    const rec = { id:'p'+(++SEQ), emp:state.uid, type, ts:`${ymd(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}` };
    if (lat!=null){ rec.lat = Math.round(lat*1e6)/1e6; rec.lng = Math.round(lng*1e6)/1e6; rec.acc = Math.round(acc||0); }
    DB.punches.push(rec);
    savePunchMonth(ymd(now).slice(0,7));
    flash = `✅ ${label} 完成 · ${pad(now.getHours())}:${pad(now.getMinutes())}${lat!=null?'　📍已記錄地點':''}`;
    render();
  };
  try {
    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => finish(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
        () => finish(null,null,null),                      // 使用者拒絕／定位失敗 → 照樣打卡
        { timeout:5000, maximumAge:60000 }
      );
    } else finish(null,null,null);
  } catch(e){ finish(null,null,null); }
}
/* 刪除單筆打卡（僅管理員可刪，含員工本人的紀錄） */
function deletePunch(id, emp2, type, ts){
  const i = DB.punches.findIndex(p =>
    (id && String(p.id)===String(id)) ||
    (!id && String(p.emp)===String(emp2) && p.type===type && p.ts===ts));
  if (i < 0){ flash='⚠️ 找不到該筆打卡（可能已刪除）'; render(); return; }
  const p = DB.punches[i];
  // 打卡紀錄僅管理員可刪除（含員工本人的紀錄）：避免任何人自行刪掉對自己不利的出勤證據
  if (!isAdmin()){ flash='🔒 打卡紀錄如有錯誤，請聯繫管理員協助刪除／補登，個人無法自行刪除。'; render(); return; }
  const mon = String(p.ts).slice(0,7);
  DB.punches.splice(i,1);
  savePunchMonth(mon);
  const who = emp(p.emp) || {no:'',name:'?'};
  pushAudit('刪除打卡', `${who.no} ${who.name}`, `${p.type} @ ${fmtD(p.ts).slice(5)} ${fmtT(p.ts)}`);
  flash = `🗑️ 已刪除打卡：${fmtD(p.ts).slice(5)} ${fmtT(p.ts)}`;
  render();
}

function leaveDaysOf(fd){
  if (fd.start===fd.end && fd.period==='HOURS'){
    const h = Math.round((+fd.hoursInput||0)*4)/4;        // 以 0.25 小時（15 分）為單位
    return { days: Math.round(h/8*1000)/1000, hours:h, byHour:true };
  }
  if (fd.start===fd.end && (fd.period==='AM'||fd.period==='PM')) return { days:0.5, hours:4, half:fd.period };
  const d1=new Date(fd.start), d2=new Date(fd.end); let days=0;
  for (let d=new Date(d1); d<=d2; d.setDate(d.getDate()+1)){
    if (twDayType(ymd(d))==='WORKDAY') days++;          // 例假／休息日／國定假日不計入請假日數
  }
  return { days, hours:days*8 };
}
/* 附件上傳：優先用 assets 能力存實體檔案；不可用時退回只記檔名 */
async function uploadLeaveFile(file){
  try {
    const assets = (window.claude && claude.use) ? await claude.use('assets') : null;
    if (assets && assets.upload){
      const r = await assets.upload(file);
      return { name:file.name, url:r.url||null, assetId:r.id||null };
    }
  } catch(e){ console.warn('asset upload failed', e); }
  return { name:file.name, url:null, assetId:null };
}
function submitLeave(fd, form, fileMeta){
  const t = LT(fd.type), e = me();
  const editId = (form && form.dataset.id) || null;
  const fileName = (fileMeta && fileMeta.name) || '';
  const fileUrl  = (fileMeta && fileMeta.url) || null;
  if (fd.start && fd.end && new Date(fd.end) < new Date(fd.start)) return errMsg('結束日不得早於開始日');
  if (fd.period==='HOURS'){
    if (!canHourly(t.code)) return errMsg(`「${t.name}」不得以小時為單位，請改選「全天」或「上午／下午（半天）」`);
    if (fd.start!==fd.end) return errMsg('以小時請假時，開始與結束日期須為同一天');
    if (!(+fd.hoursInput>0)) return errMsg('請填寫請假時數（0.25～8 小時）');
    if (+fd.hoursInput>8) return errMsg('單日以小時請假不得超過 8 小時，整天請改選「全天」');
  }
  const { days, hours, byHour, half } = leaveDaysOf(fd);
  if (days===0) return errMsg('所選期間內沒有應出勤日（已排除週末與國定假日）');
  if (t.attach==='REQUIRED' && !fileName && !(editId && findMyReq('leave',editId)?.attach)) return errMsg(`「${t.name}」必須檢附：${t.doc}`);
  if (t.attach==='CONDITIONAL' && days>3 && !fileName) return errMsg(`「${t.name}」逾 3 日必須檢附：${t.doc}`);
  if (t.attach==='FORBIDDEN' && fileName) return errMsg(`「${t.name}」依規定不得要求檢附證明文件`);

  // 補休：以「已核准且未逾 6 個月」之加班時數池為額度
  if (t.code==='COMP_OFF'){
    const pool = compTimePool(e.id, new Date(fd.start));
    const selfH = editId ? (findMyReq('leave',editId)?.hours || 0) : 0;
    if (hours > pool.avail + selfH)
      return errMsg(`補休時數不足：目前可補休 ${pool.avail} 小時${pool.expired?`（另有 ${pool.expired} 小時已逾 6 個月，應改發加班費）`:''}，本次申請 ${hours} 小時。`);
  } else {
    // 一般假別額度檢核（特休走週年制；其餘走年度 quota）
    const bal = leaveBalance(e.id, t.code, new Date(fd.start));
    const selfDays = editId ? (findMyReq('leave',editId)?.days || 0) : 0;
    if (bal.left!=null && days > bal.left + selfDays)
      return errMsg(`「${t.name}」餘額不足：本${t.code==='ANNUAL'?'週年期':'年度'}額度 ${bal.quota} 日，已用／簽核中 ${bal.used+bal.pend-selfDays} 日，本次申請 ${days} 日。`);
  }

  if (editId){
    const rec = findMyReq('leave', editId);
    if (!editableReq(rec)) return errMsg('此申請已進入簽核流程，無法修改，請先「取消」再重新申請');
    Object.assign(rec, { type:t.code, start:fd.start, end:fd.end, days, hours, byHour:!!byHour, half:half||null,
      reason:fd.reason, attach: fileName || rec.attach, attachUrl: fileUrl || rec.attachUrl || null,
      steps: resolveSteps(e, t.hrReview) });
    saveAll(); flash='✏️ 已更新請假申請（簽核關卡已重置）'; goHash('#/leave'); return;
  }
  DB.leaves.push({ id:++SEQ, emp:e.id, type:t.code, start:fd.start, end:fd.end, days, hours, byHour:!!byHour, half:half||null,
    reason:fd.reason, attach:fileName, attachUrl:fileUrl, status:'PENDING', steps:resolveSteps(e, t.hrReview) });
  saveAll();
  flash='📝 請假申請已送出，已送交簽核'; goHash('#/leave');
}
/* 導頁：更新 route。若 hash 不變則直接重繪；若改變則交給 hashchange 監聽器重繪（flash 保留一次） */
function goHash(h){
  state.route = h.replace(/^#\//,'');
  if (location.hash === h) render();
  else location.hash = h;
}
function submitOvertime(fd, form){
  const e=me();
  const editId = (form && form.dataset.id) || null;
  const [sh,sm]=fd.start.split(':').map(Number), [eh,em]=fd.end.split(':').map(Number);
  const hours=Math.round((((eh*60+em)-(sh*60+sm))/60)*100)/100;
  if (hours<=0) return errMsg('結束時間需晚於開始時間');
  const dayType = twDayType(fd.date);
  if (dayType==='WORKDAY' && hours>4) return errMsg('平日延長工時每日不得超過 4 小時（正常 8＋加班 4＝12 小時上限）');
  if ((dayType==='REST_DAY'||dayType==='HOLIDAY') && hours>12) return errMsg('休息日／假日出勤連同正常工時不得超過 12 小時');
  const others = DB.overtime.filter(o=>String(o.emp)===String(e.id) && String(o.id)!==String(editId||'') && ['APPROVED','PENDING'].includes(o.status) && o.date.startsWith(fd.date.slice(0,7)));
  const mMins = others.reduce((s,o)=>s+o.hours*60,0) + hours*60;
  const lim = otLimit(mMins,false);
  const wb = wageBaseMonthly(e);
  const est = fd.comp==='PAY' ? overtimePay(wb, hours, dayType) : null;
  if (editId){
    const rec = findMyReq('overtime', editId);
    if (!editableReq(rec)) return errMsg('此加班單已進入簽核流程，無法修改');
    Object.assign(rec, { date:fd.date, start:fd.start, end:fd.end, hours, dayType, comp:fd.comp,
      reason:fd.reason, wageBase:wb, estPay:est, steps:resolveSteps(e, lim.level!=='OK') });
    saveAll(); flash='✏️ 已更新加班申請'; location.hash='#/overtime'; return;
  }
  DB.overtime.push({ id:++SEQ, emp:e.id, date:fd.date, start:fd.start, end:fd.end, hours,
    dayType, comp:fd.comp, reason:fd.reason, wageBase:wb, status:'PENDING', estPay:est, steps:resolveSteps(e, lim.level!=='OK') });
  saveAll();
  flash = lim.level==='OK' ? '⏱️ 加班申請已送出' : `⏱️ 加班申請已送出（當月已達 §32 上限 ${lim.level==='WARN'?'80%':'100%'}，自動加簽人資）`;
  location.hash='#/overtime';
}
function submitTrip(fd, form){
  const e=me();
  const editId = (form && form.dataset.id) || null;
  const kind = editId ? tripKindOf(editId) : (fd.kind==='OUTING'?'outing':fd.kind==='WFH'?'wfh':'trip');

  if (kind==='outing'){
    const patch = { date:fd.date, start:fd.start, end:fd.end, location:fd.location, purpose:fd.purpose };
    if (editId){ const rec=findMyReq('outing',editId); if(!editableReq(rec)) return errMsg('此單已進入簽核，無法修改');
      Object.assign(rec, patch, { steps:resolveSteps(e,false) }); }
    else DB.outings.push({ id:++SEQ, emp:e.id, ...patch, status:'PENDING', steps:resolveSteps(e,false) });
  } else if (kind==='wfh'){
    const patch = { date:fd.date, location:fd.location, plan:fd.plan };
    if (editId){ const rec=findMyReq('wfh',editId); if(!editableReq(rec)) return errMsg('此單已進入簽核，無法修改');
      Object.assign(rec, patch, { steps:resolveSteps(e,false) }); }
    else DB.wfh.push({ id:++SEQ, emp:e.id, ...patch, status:'PENDING', steps:resolveSteps(e,false) });
  } else {
    if (fd.start && fd.end && new Date(fd.end) < new Date(fd.start)) return errMsg('結束日不得早於開始日');
    // 出差津貼以「日曆天」計（含週末）：每一天人都在外地
    const d1=new Date(fd.start+'T00:00'), d2=new Date(fd.end+'T00:00');
    const days=Math.max(1, Math.round((d2-d1)/86400000)+1);
    const pdRate=perDiemRate(e.role), perDiem=days*pdRate;
    const escalate=(+fd.cost||0)>30000 || fd.scope==='OVERSEAS' || days>3;
    const patch = { scope:fd.scope, start:fd.start, end:fd.end, dest:fd.dest, purpose:fd.purpose,
      cost:+fd.cost||null, days, pdRate, perDiem };
    if (editId){ const rec=findMyReq('trip',editId); if(!editableReq(rec)) return errMsg('此出差單已進入簽核，無法修改');
      Object.assign(rec, patch, { steps:resolveSteps(e, escalate) }); }
    else DB.trips.push({ id:++SEQ, emp:e.id, ...patch, status:'PENDING', steps:resolveSteps(e, escalate) });
  }
  saveAll();
  flash = editId ? '✏️ 已更新申請' : '🚗 申請已送出'; location.hash='#/trip';
}
function saveStaff(fd, id){
  const num = v => { const n = +v; return isFinite(n) ? n : 0; };
  const flow=[fd.f1,fd.f2,fd.f3].filter(Boolean).map(Number).filter(n=>isFinite(n));
  if(!fd.name || !fd.name.trim()) return errMsg('請填姓名');
  if(!fd.username || !fd.username.trim()) return errMsg('請填登入帳號');
  const base={ no:fd.no||'', name:fd.name.trim(), username:fd.username.trim().toLowerCase(), dept:num(fd.dept)||1,
    title:fd.title||'', role:fd.role||'EMPLOYEE', hire:fd.hire||ymd(TODAY), leaveDate:fd.leaveDate||null,
    salary:num(fd.salary), meal:num(fd.meal), mgrAllow:num(fd.mgrAllow), otherAllow:num(fd.otherAllow),
    dependents:Math.max(0,Math.round(num(fd.dependents))), laborSelf:num(fd.laborSelf), healthSelf:num(fd.healthSelf),
    healthDepartFull: fd.healthDepartFull==='1', flow };
  if (id!=null && id!==''){
    const target = emp(id);
    if (!target){ return errMsg('找不到要編輯的員工（id=' + id + '）。請回員工清單重新點「編輯」。'); }
    const dup = EMP.find(x=>x.username===base.username && String(x.id)!==String(target.id));
    if (dup) return errMsg('登入帳號「'+base.username+'」已被其他員工使用');
    const diffs = [];
    if (num(target.salary)!==base.salary) diffs.push(`本薪 ${target.salary}→${base.salary}`);
    if ((target.role||'')!==base.role) diffs.push(`角色 ${ROLE_LABEL[target.role]||target.role}→${ROLE_LABEL[base.role]||base.role}`);
    if (num(target.mgrAllow)!==base.mgrAllow) diffs.push(`主管津貼 ${target.mgrAllow||0}→${base.mgrAllow}`);
    if (num(target.otherAllow)!==base.otherAllow) diffs.push(`其他津貼 ${target.otherAllow||0}→${base.otherAllow}`);
    if (num(target.meal)!==base.meal) diffs.push(`伙食津貼 ${target.meal||0}→${base.meal}`);
    if ((target.leaveDate||'')!==(base.leaveDate||'')) diffs.push(`離職日 ${target.leaveDate||'—'}→${base.leaveDate||'—'}`);
    const ti = EMP.indexOf(target);                       // 用「換掉整個物件」而非改欄位，避免對凍結物件賦值出錯
    EMP[ti] = { ...target, ...base, id: target.id, mgr: flow[0] || target.mgr || 1 };
    pushAudit('修改員工資料', `${base.no} ${base.name}`, diffs.length?diffs.join('；'):'一般欄位更新');
    flash='💾 已更新 '+base.name+' 的資料';
  } else {
    if (EMP.some(x=>x.username===base.username)) return errMsg('登入帳號已存在，請換一個');
    const nid=(EMP.length?Math.max(...EMP.map(x=>+x.id||0)):0)+1;
    EMP.push({ id:nid, mgr:flow[0]||1, ...base });
    pushAudit('新增員工', `${base.no} ${base.name}`, `帳號 ${base.username}／角色 ${ROLE_LABEL[base.role]||base.role}／本薪 ${base.salary}`);
    flash='✅ 已建立員工帳號：'+base.name+'（帳號 '+base.username+'／密碼 '+PW+'）';
  }
  saveAll();
  state.route='staff';
  location.hash='#/staff';
  if (state.route==='staff' && location.hash==='#/staff') render();
}
function decide(kind,id,action){
  const map={LEAVE:DB.leaves,OVERTIME:DB.overtime,TRIP:DB.trips,OUTING:DB.outings,WFH:DB.wfh};
  const x=map[kind].find(r=>String(r.id)===String(id));
  if(!x){ errMsg('找不到單據'); return; }
  const idx=x.steps.findIndex(s=>s.st==='PENDING');
  if(idx<0){ render(); return; }
  const cmt=(document.getElementById(`cmt-${kind}-${id}`)||{}).value||'';
  x.steps[idx].st=action; x.steps[idx].cmt=cmt;
  if (action==='REJECTED') x.status='REJECTED';
  else if (idx===x.steps.length-1) x.status='APPROVED';
  const K={LEAVE:'請假',OVERTIME:'加班',TRIP:'出差',OUTING:'外出',WFH:'遠距'}[kind]||kind;
  pushAudit(action==='APPROVED'?'簽核核准':'簽核駁回', `${(emp(x.emp)||{name:'?'}).name} 的${K}單`,
    `第 ${idx+1} 關${cmt?`：${cmt}`:''}${x.status==='APPROVED'?'（全部關卡通過）':x.status==='REJECTED'?'（駁回）':'（待下一關）'}`);
  saveAll();
  flash = action==='APPROVED'?'✅ 已核准':'✖ 已駁回';
  render();
}

function bind(){
  const base=state.route.split('?')[0].split('/')[0]||'dashboard';
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('on', a.dataset.r===base));
  const all=[...NAV,...NAV_ADMIN,{r:'leave/new',label:'請假'},{r:'overtime/new',label:'加班'},{r:'trip/new',label:'出差／外出'},{r:'payslip',label:'薪酬明細'},{r:'my-payslips',label:'我的薪酬'},{r:'login',label:'登入'}];
  document.getElementById('pageTitle').textContent=(all.find(n=>n.r===state.route.split('?')[0])||all.find(n=>n.r===base)||{label:'首頁'}).label;

  document.querySelectorAll('#view [data-act]').forEach(el=>{
    const act=el.dataset.act;
    if (act==='tripKind'){ el.onchange=()=>{ document.getElementById('tripFields').innerHTML=tripFieldsHtml(el.value); }; return; }
    if (act==='payrollEmp'){ el.onchange=()=>{ const f=el.form; location.hash=`#/payroll?e=${el.value}&y=${f.y.value}&m=${f.m.value}`; }; return; }
    if (act==='leaveType'){
      const upd=()=>{ const a=document.getElementById('attHint'); if(a) a.innerHTML=attHintHtml(el.value);
        const b=document.getElementById('balHint'); if(b) b.innerHTML=balHintHtml(el.value);
        const per=document.querySelector('[name="period"]'), hw=document.getElementById('hoursWrap');
        if(per){ const hourOpt=per.querySelector('option[value="HOURS"]');
          if(hourOpt) hourOpt.disabled=!canHourly(el.value);
          if(!canHourly(el.value) && per.value==='HOURS'){ per.value='FULL'; if(hw) hw.hidden=true; } } };
      el.onchange=upd; upd(); return;
    }
    if (act==='leavePeriod'){
      const upd=()=>{ const hw=document.getElementById('hoursWrap'); if(hw) hw.hidden = el.value!=='HOURS'; };
      el.onchange=upd; upd(); return;
    }
    if (act==='otDate'){
      const upd=()=>{ const h=document.getElementById('otHint'); if(h){ const dt=twDayType(el.value);
        h.innerHTML=`<div class="banner"><span>📅</span><div>系統判定為 <b>${DT_LABEL[dt]}</b>${dt==='OFF_DAY'?'（例假日除天災事變外不得出勤）':dt==='HOLIDAY'?'（8 小時內加發一日工資）':''}，將依 §24 對應加成試算。</div></div>`; } };
      el.onchange=upd; el.oninput=upd; upd(); return;
    }
    el.onclick=ev=>{ try {
      if (act==='quick'){ doLogin(el.dataset.u, PW); }
      if (act==='punch'){ recordPunch(el.dataset.type, el.textContent.trim()); }
      if (act==='delPunch'){ deletePunch(el.dataset.id, el.dataset.emp, el.dataset.type, el.dataset.ts); }
      if (act==='leaveScope'){
        const s = document.getElementById('leaveTypeSel');
        if (s){
          const showAll = s.dataset.scope !== 'all';
          const cur = s.value;
          const list = showAll ? LEAVE_TYPES : LEAVE_TYPES.filter(t=>COMMON_LEAVE.has(t.code));
          s.innerHTML = list.map(t=>`<option value="${t.code}" ${t.code===cur?'selected':''}>${t.name}（${t.basis}）${canHourly(t.code)?' · 得按時':''}</option>`).join('');
          s.dataset.scope = showAll ? 'all' : 'common';
          el.textContent = showAll ? '︿ 只看常用假別' : '︾ 顯示全部假別（婚喪／產假／育嬰留停等）';
          const b=document.getElementById('balHint'); if(b) b.innerHTML=balHintHtml(s.value);
          const a=document.getElementById('attHint'); if(a) a.innerHTML=attHintHtml(s.value);
        }
      }
      if (act==='cancelReq'){ cancelReq(el.dataset.kind, el.dataset.id); }
      if (act==='csvSummary'){ downloadFile(`綠谷_月出勤彙總_${el.dataset.ym}.csv`, reportSummaryCSV(el.dataset.ym), 'text/csv'); }
      if (act==='csvDetail'){ downloadFile(`綠谷_逐日出勤明細_${el.dataset.ym}.csv`, reportDetailCSV(el.dataset.ym), 'text/csv'); }
      if (act==='csvAudit'){ downloadFile(`綠谷_稽核軌跡_${ymd(TODAY)}.csv`, auditCSV(), 'text/csv'); }
      if (act==='confirmPay'){ confirmPayslip(el.dataset.e, el.dataset.ym); }
      if (act==='resetDemo'){
        if (el.dataset.armed){ resetDemoData(); }
        else { el.dataset.armed='1'; el.textContent='⚠ 再按一次以確認清空全部資料';
          setTimeout(()=>{ try{ el.dataset.armed=''; el.textContent='清空並重建示範資料'; }catch(_){} }, 5000); }
      }
      if (act==='decide'){ decide(el.dataset.kind,el.dataset.id,el.dataset.do); }
    } catch(err){ console.error(err); flash='⚠️ 操作發生錯誤：'+(err&&err.message||err); render(); } };
  });

  document.querySelectorAll('#view [data-form]').forEach(form=>{
    if (form.dataset.form==='trip'){ const tf=document.getElementById('tripFields'); if(tf&&!tf.innerHTML) tf.innerHTML=tripFieldsHtml('TRIP'); }
    if (form.dataset.form==='staff'){
      const g = n => +((form.querySelector(`[name="${n}"]`)||{}).value) || 0;
      const lab=document.getElementById('fLaborSelf'), hea=document.getElementById('fHealthSelf');
      const recalc=()=>{ if(!lab||!hea) return; const ins=insuranceSelf(g('salary')+g('mgrAllow')+g('otherAllow')+g('meal'), g('dependents'));
        lab.value=ins.laborSelf; hea.value=ins.healthSelf; };
      ['salary','mgrAllow','otherAllow','meal','dependents'].forEach(n=>{ const el=form.querySelector(`[name="${n}"]`); if(el) el.oninput=recalc; });
    }
    form.onsubmit=ev=>{
      ev.preventDefault();
      const fd=readForm(form), k=form.dataset.form;
      try {
        if (k==='login') doLogin(fd.username, fd.password);
        else if (k==='leave'){
          const file = form.querySelector('input[type=file]')?.files?.[0];
          if (file){
            errMsg('⏳ 附件上傳中，請稍候…');
            uploadLeaveFile(file).then(meta=>submitLeave(fd, form, meta))
              .catch(err=>{ errMsg('附件處理失敗：'+(err&&err.message||err)); console.error(err); });
          } else submitLeave(fd, form, null);
        }
        else if (k==='overtime') submitOvertime(fd, form);
        else if (k==='trip') submitTrip(fd, form);
        else if (k==='staff') saveStaff(fd, (form.dataset.id!=null && form.dataset.id!=='') ? form.dataset.id : null);
        else if (k==='payroll') location.hash=`#/payroll?e=${fd.e}&y=${fd.y}&m=${fd.m}`;
        else if (k==='reports') location.hash=`#/reports?y=${fd.y}&m=${fd.m}`;
        else if (k==='audit') location.hash=`#/audit?kw=${encodeURIComponent(fd.kw||'')}`;
        else if (k==='adminPunch') adminAddPunch(form.dataset.emp, fd.date, fd.endDate, fd.type, fd.time);
      } catch(err){ errMsg('發生錯誤：'+(err&&err.message||err)); console.error(err); }
    };
  });
}

function doLogin(u,p){
