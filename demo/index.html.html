<title>綠谷國際 人資考勤系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground:#F4F6F3; --surface:#FFFFFF; --surface-2:#EDF1ED; --raise:#FBFCFB;
    --ink:#18211D; --ink-soft:#586761; --ink-faint:#8A968F; --line:#E0E6DF;
    --brand:#1B4A3A; --brand-ink:#FFFFFF; --brand-soft:#E7EFEA;
    --sidebar:#173F31; --sidebar-ink:#EAF3EE;
    --data:#BC5B0E;                       /* 數據用橘色 */
    --good:#2E7D5B; --good-bg:#E7F1EB;
    --warn:#8A5D0E; --warn-bg:#F8EFDD;
    --orange:#B4530E; --orange-bg:#FBEBDD;
    --bad:#A93A31; --bad-bg:#F7E9E7;
    --focus:#3E8266;
    --shadow:0 1px 2px rgba(20,40,32,.06), 0 4px 16px -8px rgba(20,40,32,.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0E1310; --surface:#161D19; --surface-2:#1E2721; --raise:#1B231E;
      --ink:#E7EDE8; --ink-soft:#9DABA3; --ink-faint:#6C7A72; --line:#2A342E;
      --brand:#66AC8F; --brand-ink:#0E1310; --brand-soft:#1D2B24;
      --sidebar:#12352A; --sidebar-ink:#E7F1EC;
      --data:#E8975A;
      --good:#5FB98C; --good-bg:#16231C;
      --warn:#D8A441; --warn-bg:#2A2213;
      --orange:#E8975A; --orange-bg:#2C2013;
      --bad:#E27A6E; --bad-bg:#2C1A17;
      --focus:#6FA88F;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0E1310; --surface:#161D19; --surface-2:#1E2721; --raise:#1B231E;
    --ink:#E7EDE8; --ink-soft:#9DABA3; --ink-faint:#6C7A72; --line:#2A342E;
    --brand:#66AC8F; --brand-ink:#0E1310; --brand-soft:#1D2B24;
    --sidebar:#12352A; --sidebar-ink:#E7F1EC;
    --data:#E8975A;
    --good:#5FB98C; --good-bg:#16231C;
    --warn:#D8A441; --warn-bg:#2A2213;
    --orange:#E8975A; --orange-bg:#2C2013;
    --bad:#E27A6E; --bad-bg:#2C1A17;
    --focus:#6FA88F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Noto Sans TC","Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3 { font-family:"Noto Serif TC",Georgia,"Songti TC",serif; text-wrap:balance; margin:0; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; }
  .mono { font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .app { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  body.anon .app { grid-template-columns:1fr; }
  body.anon .side, body.anon .topbar { display:none; }

  .side {
    background:var(--sidebar); color:var(--sidebar-ink); display:flex; flex-direction:column;
    gap:3px; padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brandmark { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
  .brandmark .sq {
    width:34px; height:34px; border:1.5px solid rgba(255,255,255,.5); border-radius:7px;
    display:grid; place-items:center; font-family:"Noto Serif TC",serif; font-weight:700; font-size:13px; letter-spacing:1px;
  }
  .brandmark b { font-family:"Noto Serif TC",serif; font-size:15px; font-weight:700; letter-spacing:.5px; display:block; }
  .brandmark span { font-size:10.5px; letter-spacing:2px; color:rgba(234,243,238,.65); }
  .navlink {
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:rgba(234,243,238,.82); font-weight:500; font-size:13.5px; cursor:pointer;
  }
  .navlink:hover { background:rgba(255,255,255,.09); color:#fff; }
  .navlink.on { background:#fff; color:#173F31; font-weight:700; }
  .navlink .ic { width:18px; text-align:center; font-size:14px; }
  .navgroup { margin-top:14px; padding:8px 12px 4px; font-size:10.5px; letter-spacing:2px; color:rgba(234,243,238,.45); }

  .main { min-width:0; display:flex; flex-direction:column; }
  .topbar {
    display:flex; align-items:center; gap:14px; padding:15px 30px;
    border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:5;
  }
  .topbar h1 { font-size:19px; font-weight:700; flex:1; }
  .topbar .u { font-size:12.5px; color:var(--ink-soft); }
  .iconbtn {
    height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--raise);
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px;
  }
  .iconbtn:hover { color:var(--ink); border-color:var(--ink-faint); }
  .content { padding:26px 30px 64px; max-width:1080px; width:100%; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px 16px; }
  .tile .k { font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; }
  .tile .v { font-size:23px; font-weight:700; margin-top:4px; letter-spacing:-.01em; color:var(--data);
    font-variant-numeric:tabular-nums; }
  .tile .v.plain { color:var(--ink); }
  .tile .hint { font-size:11.5px; color:var(--ink-faint); margin-top:3px; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:var(--shadow); }
  .panel > h2 { font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .panel + .panel { margin-top:20px; }
  .stack { display:flex; flex-direction:column; gap:20px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { text-align:left; font-weight:600; color:var(--ink-soft); font-size:11.5px; letter-spacing:.04em;
    padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td { padding:9px 10px; border-bottom:1px solid var(--surface-2); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  .tablewrap { overflow-x:auto; }
  .num { text-align:right; font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums; color:var(--data); }
  .muted { color:var(--ink-faint); }

  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px;
    font-size:11.5px; font-weight:600; background:var(--surface-2); color:var(--ink-soft); }
  .badge.good { background:var(--good-bg); color:var(--good); }
  .badge.warn { background:var(--warn-bg); color:var(--warn); }
  .badge.bad  { background:var(--bad-bg);  color:var(--bad); }
  .badge.orange { background:var(--orange-bg); color:var(--orange); }
  .badge.info { background:var(--brand-soft); color:var(--brand); }

  .ablock { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:8px;
    font-size:11.5px; font-weight:700; margin:2px 4px 2px 0; border:1px solid transparent; }
  .ablock.warn { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
  .ablock.bad  { background:var(--bad-bg); color:var(--bad); border-color:var(--bad); }
  .ablock.orange { background:var(--orange-bg); color:var(--orange); border-color:var(--orange); }

  .btn { padding:9px 15px; border-radius:9px; border:1px solid var(--line); background:var(--raise);
    color:var(--ink); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { border-color:var(--ink-faint); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn.sm { padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn.link { border:none; background:none; color:var(--brand); padding:0; font-weight:600; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select, .field textarea {
    font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--raise); color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline:2px solid var(--focus); border-color:var(--focus); }
  input[type=file] { font-size:12px; }
  .formgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }

  .note { font-size:12px; color:var(--ink-faint); margin-top:10px; }
  .callout { display:flex; gap:9px; align-items:flex-start; padding:10px 13px; border-radius:9px;
    background:var(--warn-bg); color:var(--warn); font-size:12.5px; font-weight:600; margin-top:12px; }
  .banner { display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:10px;
    background:var(--brand-soft); color:var(--brand); font-size:12.5px; }
  .flash { padding:9px 13px; border-radius:9px; background:var(--good-bg); color:var(--good);
    font-size:12.5px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:7px; }
  .flash.err { background:var(--bad-bg); color:var(--bad); }
  .chain { font-size:11.5px; color:var(--ink-faint); }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--surface-2); }
  .kv:last-child { border-bottom:none; }
  .kv .amt { font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums; color:var(--data); white-space:nowrap; }
  .kv.total { font-weight:700; }
  .kv.total .amt { color:var(--data); }
  .subnote { font-size:11px; color:var(--ink-faint); font-weight:400; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  .login { max-width:380px; margin:8vh auto 0; }
  .login .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px; box-shadow:var(--shadow); }
  .login .mk { text-align:center; margin-bottom:18px; }
  .login .mk .sq { width:52px; height:52px; margin:0 auto 8px; border-radius:12px; background:var(--brand);
    color:#fff; display:grid; place-items:center; font-family:"Noto Serif TC",serif; font-weight:700; }

  @media (max-width:780px){
    .app { grid-template-columns:1fr; }
    .side { position:static; height:auto; flex-direction:row; overflow-x:auto; gap:2px; padding:10px; align-items:center; }
    .brandmark { padding:4px 8px; flex-shrink:0; }
    .brandmark b, .brandmark span, .navgroup { display:none; }
    .navlink { white-space:nowrap; padding:8px 11px; }
    .topbar { padding:12px 16px; flex-wrap:wrap; }
    .content { padding:18px 16px 50px; }
  }
  @media (prefers-reduced-motion:reduce){ * { transition:none !important; } }
</style>

  <aside class="side"><div class="brandmark"><div class="sq">綠谷</div><div><b>綠谷國際</b><span>GV&nbsp;STUDIO</span></div></div><nav id="nav"></nav></aside>
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">首頁</h1>
      <span class="u" id="whoLabel"></span>
      <button class="iconbtn" id="themeBtn" aria-label="切換深色/淺色">◐ 主題</button>
      <button class="iconbtn" id="logoutBtn">⎋ 登出</button>
    </header>
    <div class="content"><div id="view"></div></div>

<script>
/* ===================================================================
   綠谷國際 人資考勤系統 — 互動 Demo（前端單檔，資料存記憶體）
   特休(週年制) / 加班費 / 月薪試算 計算與正式版 TypeScript 邏輯一致
   =================================================================== */

const TODAY = new Date(2026, 8, 9, 14, 30);     // 2026-09-09（示範基準日）
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtD = s => { const d=new Date(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const fmtT = s => { const d=new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => 'NT$ ' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 特休（勞基法 §38，週年制） ---------- */
function monthsOfService(hire,asOf){
  let m=(asOf.getFullYear()-hire.getFullYear())*12+(asOf.getMonth()-hire.getMonth());
  if(asOf.getDate()<hire.getDate()) m--;
  return Math.max(0,m);
}
const yearsOfService=(h,a)=>Math.floor(monthsOfService(h,a)/12);
function annualLeaveDays(hire,asOf){
  const m=monthsOfService(hire,asOf), y=Math.floor(m/12);
  if(m<6)return 0; if(m<12)return 3;
  if(y<2)return 7; if(y<3)return 10; if(y<5)return 14; if(y<10)return 15;
  return Math.min(15+(y-9),30);
}
function anniversaryPeriod(hire,asOf){
  const m=monthsOfService(hire,asOf);
  const six=new Date(hire); six.setMonth(six.getMonth()+6);
  const first=new Date(hire); first.setFullYear(first.getFullYear()+1);
  let ps,pe;
  if(m<6){ ps=new Date(hire); pe=new Date(six); pe.setDate(pe.getDate()-1); }
  else if(m<12){ ps=new Date(six); pe=new Date(first); pe.setDate(pe.getDate()-1); }
  else { const y=Math.floor(m/12);
    ps=new Date(hire); ps.setFullYear(ps.getFullYear()+y);
    pe=new Date(hire); pe.setFullYear(pe.getFullYear()+y+1); pe.setDate(pe.getDate()-1); }
  return { start:ps, end:pe, granted:m<6?0:annualLeaveDays(hire,ps),
           daysLeft:Math.ceil((pe-asOf)/86400000) };
}

/* ---------- 加班費（§24）／上限（§32） ---------- */
const hourly = s => s/240;
function weekdayOt(r,h){ return Math.min(h,2)*r*(4/3)+Math.max(h-2,0)*r*(5/3); }
function overtimePay(salary,hours,dayType){
  const r=hourly(salary);
  if(dayType==='WORKDAY'||dayType==='REST_DAY') return Math.round(weekdayOt(r,hours));
  return Math.round(r*8+weekdayOt(r,Math.max(hours-8,0)));      // 國定假日 / 例假
}
function otLimit(mins,agreement){
  const cap=(agreement?54:46)*60, ratio=mins/cap;
  let level='OK';
  if(mins>cap)level='BREACH'; else if(ratio>=1)level='ALERT'; else if(ratio>=.8)level='WARN';
  return { cap, ratio, level };
}

/* ---------- 月薪試算（綠谷：無全勤獎金；含伙食津貼 3,000 免稅） ---------- */
function computePayroll(i){
  const hr=i.monthlySalary/240, dw=i.monthlySalary/30;
  const earnings=[], deductions=[], flags=[];
  earnings.push({ label:'本薪（月薪）', amount:Math.round(i.monthlySalary) });
  if(i.meal>0)       earnings.push({ label:'伙食津貼', amount:Math.round(i.meal), note:'免稅上限 3,000／月' });
  if(i.mgrAllow>0)   earnings.push({ label:'主管津貼', amount:Math.round(i.mgrAllow) });
  if(i.otherAllow>0) earnings.push({ label:'其他津貼', amount:Math.round(i.otherAllow) });
  if(i.overtimePay>0) earnings.push({ label:'加班費（本月核定）', amount:Math.round(i.overtimePay) });
  if(i.perDiem>0) earnings.push({ label:`出差津貼（${i.perDiemDays} 日）`, amount:Math.round(i.perDiem), note:`每日 ${i.pdRate||''}` });
  if(i.unpaidHours>0) deductions.push({ label:`事假／無薪假扣薪（${i.unpaidHours} 小時）`, amount:Math.round(hr*i.unpaidHours), note:`時薪 ${Math.round(hr)} × ${i.unpaidHours}h` });
  if(i.halfHours>0)   deductions.push({ label:`病假／生理假扣薪（${i.halfHours} 小時，半薪）`, amount:Math.round(hr*i.halfHours*0.5), note:`時薪 ${Math.round(hr)} × ${i.halfHours}h × 50%` });
  if(i.absentDays>0)  deductions.push({ label:`曠職扣薪（${i.absentDays} 日）`, amount:Math.round(dw*i.absentDays), note:`日薪 ${Math.round(dw)} × ${i.absentDays}` });
  if(i.lateMin>0)     deductions.push({ label:`遲到扣薪（${i.lateMin} 分鐘）`, amount:Math.round(hr*i.lateMin/60), note:'按未提供勞務時間比例，未另立罰款' });
  if(i.earlyMin>0)    deductions.push({ label:`早退扣薪（${i.earlyMin} 分鐘）`, amount:Math.round(hr*i.earlyMin/60), note:'按未提供勞務時間比例' });
  if(i.laborSelf>0)   deductions.push({ label:'勞保費（自付）', amount:Math.round(i.laborSelf) });
  if(i.healthSelf>0)  deductions.push({ label:'健保費（自付）', amount:Math.round(i.healthSelf) });
  const gross=earnings.reduce((s,e)=>s+e.amount,0);
  const totDed=deductions.reduce((s,d)=>s+d.amount,0);
  return { hourly:Math.round(hr), daily:Math.round(dw), earnings, deductions, gross, totDed, net:gross-totDed, flags };
}

/* =========================  種子資料  ========================= */
/* 假別主檔：code,name,基準,工資(1/.5/0),年度額度,附件規則,應檢附文件,需HR覆核 */
const LEAVE_TYPES = [
  ['ANNUAL','特別休假','勞基法 §38',1,null,'OPTIONAL','—',false],
  ['MARRIAGE','婚假','勞工請假規則 §2',1,8,'REQUIRED','結婚證書／戶籍謄本／喜帖 擇一',false],
  ['BEREAVE8','喪假（父母、配偶）','勞工請假規則 §3',1,8,'REQUIRED','死亡證明書／除戶戶籍謄本／訃聞',false],
  ['BEREAVE6','喪假（祖父母、子女、配偶父母）','勞工請假規則 §3',1,6,'REQUIRED','死亡證明書＋關係證明',false],
  ['BEREAVE3','喪假（曾祖父母、兄弟姊妹）','勞工請假規則 §3',1,3,'REQUIRED','死亡證明書',false],
  ['SICK','普通傷病假（未住院）','勞工請假規則 §4',0.5,30,'REQUIRED','診斷證明書（病單）— 公司規定一律檢附',false],
  ['SICK_HOSP','普通傷病假（住院）','勞工請假規則 §4',0.5,365,'REQUIRED','住院證明、診斷證明書',true],
  ['PREG_REST','安胎休養假','性平法 §15',0.5,null,'REQUIRED','醫師診斷證明書（載明安胎）',true],
  ['MENSTRUAL','生理假','性別平等工作法 §14',0.5,12,'FORBIDDEN','不得要求檢附證明',false],
  ['MATERNITY','產假（分娩）','勞基法 §50',1,56,'REQUIRED','嬰兒出生證明、戶口名簿',true],
  ['MIS_4W','產假（妊娠 3 個月以上流產）','勞基法 §50',1,28,'REQUIRED','診斷證明書',true],
  ['MIS_1W','產假（妊娠 2–3 個月流產）','勞基法 §50',1,7,'REQUIRED','診斷證明書',true],
  ['MIS_5D','產假（妊娠未滿 2 個月流產）','勞基法 §50',1,5,'REQUIRED','診斷證明書',true],
  ['PRENATAL','產檢假','性平法 §15',1,7,'REQUIRED','產檢紀錄／孕婦健康手冊',false],
  ['PATERNITY','陪產檢及陪產假','性平法 §15',1,7,'REQUIRED','配偶就診證明／嬰兒出生證明',false],

function monthAttendance(empId, ym){
  const rows = DB.att.filter(a=>a.emp===empId && a.date.startsWith(ym))
                     .sort((a,b)=>a.date.localeCompare(b.date));

  // 今日（9/9）即時列：依打卡 / 請假 / 出差
  if (ym==='2026-09'){
    const today='2026-09-09';
    const onLeave=DB.leaves.find(l=>l.emp===empId&&l.status==='APPROVED'&&l.start<=today&&l.end>=today&&l.days>=1);
    const onTrip=DB.trips.find(t=>t.emp===empId&&t.status==='APPROVED'&&t.start<=today&&t.end>=today);
    const ps=DB.punches.filter(p=>p.emp===empId&&p.ts.startsWith(today));
    const pin=ps.find(p=>p.type==='IN'), pout=[...ps].reverse().find(p=>p.type==='OUT');
    let row={ emp:empId, date:today, in:'—', out:'—', late:0, early:0, status:'OPEN', anomalies:[] };
    if (onLeave) row.status='LEAVE';
    else if (onTrip) row.status='TRIP';
    else if (pin){
      const im=(+fmtT(pin.ts).split(':')[0])*60 + (+fmtT(pin.ts).split(':')[1]);
      row.in=fmtT(pin.ts); row.late=Math.max(0,im-540);
      if (pout){ const om=(+fmtT(pout.ts).split(':')[0])*60 + (+fmtT(pout.ts).split(':')[1]);
        row.out=fmtT(pout.ts); row.early=Math.max(0,1080-om); }
      row.status = row.late>0 ? 'LATE' : row.early>0 ? 'EARLY' : (pout?'NORMAL':'OPEN');
      if (row.late>0) row.anomalies.push('LATE');
      if (row.early>0) row.anomalies.push('EARLY_LEAVE');
    }
    rows.push(row);
  }

  let late=0, early=0, absent=0, missing=0; const anomalies=[];
  rows.forEach(a=>{
    late+=a.late; early+=a.early;
    if(a.status==='ABSENT' && a.anomalies.includes('ABSENT')) absent++;
    if(a.anomalies.includes('MISSING_PUNCH')) missing++;
    a.anomalies.forEach(c=>anomalies.push({code:c, date:a.date}));
  });
  return { rows, late, early, absent, missing, anomalies };
}

/* ---- 簽核 ---- */
function pendingApprovalsFor(uid){
  const out=[];
  const scan=(arr,kind)=>arr.forEach(x=>{
    if(x.status!=='PENDING')return;
    const idx=x.steps.findIndex(s=>s.st==='PENDING');
    if(idx>=0 && x.steps[idx].by===uid) out.push({kind,x,step:idx});
  });
  scan(DB.leaves,'LEAVE'); scan(DB.overtime,'OVERTIME'); scan(DB.trips,'TRIP'); scan(DB.outings,'OUTING'); scan(DB.wfh,'WFH');
  return out;
}

  const desc = ({kind,x})=>{

      return {who:emp(x.emp).name,title:'📝 請假單：'+t.name,lines:[

    if(kind==='OVERTIME') return {who:emp(x.emp).name,title:'⏱️ 加班單',lines:[
      `${fmtD(x.date)} ${x.start}–${x.end}（${x.hours} 小時）`,

    if(kind==='TRIP') return {who:emp(x.emp).name,title:'✈️ 出差單（'+(x.scope==='OVERSEAS'?'國外':'國內')+'）',lines:[
      `${fmtD(x.start)}–${fmtD(x.end)} · ${x.dest}`,`事由：${x.purpose}`,
      x.cost!=null?`預估差旅費 ${money(x.cost)}`:'',
      x.perDiem?`出差津貼 ${x.days} 日 × ${money(x.pdRate)} = ${money(x.perDiem)}`:'']};
    if(kind==='OUTING') return {who:emp(x.emp).name,title:'🚪 外出單',lines:[`${fmtD(x.date)} ${x.start}–${x.end} · ${x.location}`,`事由：${x.purpose}`]};

  };

function leaveHoursByPay(empId,ym){
  let unpaid=0,half=0,full=0;
  DB.leaves.filter(l=>l.emp===empId&&l.status==='APPROVED'&&l.start.startsWith(ym)).forEach(l=>{
    const t=LT(l.type);
    if(t.paid===0) unpaid+=l.hours; else if(t.paid===0.5) half+=l.hours; else full+=l.hours;
  });
  return {unpaid,half,full};
}

const readForm = f => { const o={}; new FormData(f).forEach((v,k)=>o[k]=v); return o; };
const errMsg = m => { const el=document.getElementById('formMsg'); if(el) el.innerHTML=`<div class="flash err" style="margin:12px 0 0">⚠️ ${esc(m)}</div>`; };

function submitLeave(fd, form){
  const t = LT(fd.type);
  const fileName = form.querySelector('input[type=file]')?.files?.[0]?.name || '';
  const same = fd.start===fd.end;
  let days,hours;
  if (same && (fd.period==='AM'||fd.period==='PM')){ days=0.5; hours=4; }
  else { const d1=new Date(fd.start), d2=new Date(fd.end); days=0;
    for(let d=new Date(d1); d<=d2; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w>=1&&w<=5) days++; }
    hours=days*8; }
  if (fd.start && fd.end && new Date(fd.end) < new Date(fd.start)) return errMsg('結束日不得早於開始日');
  if (days===0) return errMsg('所選期間內沒有應出勤日');
  // 附件檢核：必附 / 病假等逾 3 日條件式必附 / 生理假不得要求
  if (t.attach==='REQUIRED' && !fileName) return errMsg(`「${t.name}」必須檢附：${t.doc}`);
  if (t.attach==='CONDITIONAL' && days>3 && !fileName) return errMsg(`「${t.name}」逾 3 日必須檢附：${t.doc}`);
  if (t.attach==='FORBIDDEN' && fileName) return errMsg(`「${t.name}」依規定不得要求檢附證明文件`);
  const e=me();
  if (t.code==='ANNUAL'){
    const per=anniversaryPeriod(new Date(e.hire), new Date(fd.start));
    const u=DB.leaves.filter(l=>l.emp===e.id&&l.type==='ANNUAL'&&['APPROVED','PENDING'].includes(l.status)).reduce((s,l)=>s+l.days,0);
    if (days>per.granted-u) return errMsg(`特休餘額不足：本年度 ${per.granted} 日，已用／簽核中 ${u} 日，本次 ${days} 日`);
  }
  DB.leaves.push({ id:++SEQ, emp:e.id, type:t.code, start:fd.start, end:fd.end, days, hours,
    reason:fd.reason, attach:fileName, status:'PENDING', steps:resolveSteps(e, t.hrReview) });
  flash='📝 請假申請已送出，已通知簽核人（LINE）'; location.hash='#/leave';
}
function submitOvertime(fd){
  const e=me();
  const [sh,sm]=fd.start.split(':').map(Number), [eh,em]=fd.end.split(':').map(Number);
  const hours=((eh*60+em)-(sh*60+sm))/60;
  if (hours<=0) return errMsg('結束時間需晚於開始時間');
  const dow=new Date(fd.date).getDay();
  const dayType=dow===0?'OFF_DAY':dow===6?'REST_DAY':'WORKDAY';
  if (dayType==='WORKDAY'&&hours>4) return errMsg('平日單日延長工時不得超過 4 小時（12 小時上限）');
  const mMins=DB.overtime.filter(o=>o.emp===e.id&&['APPROVED','PENDING'].includes(o.status)&&o.date.startsWith(fd.date.slice(0,7))).reduce((s,o)=>s+o.hours*60,0)+hours*60;
  const lim=otLimit(mMins,false);
  const est=fd.comp==='PAY'?overtimePay(e.salary,hours,dayType):null;
  DB.overtime.push({ id:++SEQ, emp:e.id, date:fd.date, start:fd.start, end:fd.end, hours,
    dayType, comp:fd.comp, reason:fd.reason, status:'PENDING', estPay:est, steps:resolveSteps(e, lim.level!=='OK') });
  flash = lim.level==='OK'?'⏱️ 加班申請已送出':`⏱️ 加班申請已送出（當月已達上限 ${lim.level==='WARN'?'80%':'100%'}，自動加簽人資）`;
  location.hash='#/overtime';
}
function submitTrip(fd){
  const e=me();
  if (fd.kind==='OUTING'){
    DB.outings.push({ id:++SEQ, emp:e.id, date:fd.date, start:fd.start, end:fd.end, location:fd.location, purpose:fd.purpose, status:'PENDING', steps:resolveSteps(e,false) });
  } else if (fd.kind==='WFH'){
    DB.wfh.push({ id:++SEQ, emp:e.id, date:fd.date, location:fd.location, plan:fd.plan, status:'PENDING', steps:resolveSteps(e,false) });
  } else {
    const d1=new Date(fd.start), d2=new Date(fd.end); let days=0;
    for(let d=new Date(d1); d<=d2; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w>=1&&w<=5) days++; }
    days=Math.max(1,days);
    const pdRate=perDiemRate(e.role), perDiem=days*pdRate;
    const esc2=(+fd.cost||0)>30000||fd.scope==='OVERSEAS'||days>3;
    DB.trips.push({ id:++SEQ, emp:e.id, scope:fd.scope, start:fd.start, end:fd.end, dest:fd.dest, purpose:fd.purpose,
      cost:+fd.cost||null, days, pdRate, perDiem, status:'PENDING', steps:resolveSteps(e, esc2) });
  }
  flash='🚗 申請已送出'; location.hash='#/trip';
}
function saveStaff(fd, id){
  const flow=[fd.f1,fd.f2,fd.f3].filter(Boolean).map(Number);
  const base={ no:fd.no, name:fd.name, username:fd.username.trim().toLowerCase(), dept:+fd.dept, title:fd.title,
    role:fd.role, hire:fd.hire, salary:+fd.salary, meal:+fd.meal, mgrAllow:+fd.mgrAllow||0, otherAllow:+fd.otherAllow||0,
    laborSelf:+fd.laborSelf, healthSelf:+fd.healthSelf, flow };
  if (id){ Object.assign(emp(id), base); flash=`💾 已更新 ${base.name} 的資料`; }
  else {
    if (EMP.some(x=>x.username===base.username)) return errMsg('登入帳號已存在，請換一個');
    const nid=Math.max(...EMP.map(x=>x.id))+1;
    EMP.push({ id:nid, mgr:flow[0]||1, ...base });
    flash=`✅ 已建立員工帳號：${base.name}（帳號 ${base.username}／密碼 ${PW}）`;
  }
  state.route='staff';
  if (location.hash==='#/staff') render(); else location.hash='#/staff';
}
function decide(kind,id,action){
  const map={LEAVE:DB.leaves,OVERTIME:DB.overtime,TRIP:DB.trips,OUTING:DB.outings,WFH:DB.wfh};
  const x=map[kind].find(r=>r.id===id);
  const idx=x.steps.findIndex(s=>s.st==='PENDING');
  const cmt=(document.getElementById(`cmt-${kind}-${id}`)||{}).value||'';
  x.steps[idx].st=action; x.steps[idx].cmt=cmt;
  if (action==='REJECTED') x.status='REJECTED';
  else if (idx===x.steps.length-1) x.status='APPROVED';
  flash = action==='APPROVED'?'✅ 已核准，已通知申請人（LINE）':'✖ 已駁回，已通知申請人（LINE）';
  render();
}

/* =========================  框架  ========================= */
function need(n){ return n==='manager' ? isManager() : n==='approver' ? isApprover() : true; }
function buildNav(){
  const mk=n=>`<a class="navlink" data-r="${n.r}" href="#/${n.r}"><span class="ic">${n.ic}</span>${n.label}</a>`;
  let html=NAV.filter(n=>!n.need||need(n.need)).map(mk).join('');
  if (isAdmin()) html+=`<div class="navgroup">管理（權限限定）</div>`+NAV_ADMIN.map(mk).join('');
  document.getElementById('nav').innerHTML=html;
  const e=me();
  document.getElementById('whoLabel').textContent = e ? `${e.name}｜${ROLE_LABEL[e.role]}｜${DEPTS[e.dept]}` : '';
}
function bind(){
  const base=state.route.split('?')[0].split('/')[0]||'dashboard';
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('on', a.dataset.r===base));
  const all=[...NAV,...NAV_ADMIN,{r:'leave/new',label:'請假'},{r:'overtime/new',label:'加班'},{r:'trip/new',label:'出差／外出'},{r:'login',label:'登入'}];
  document.getElementById('pageTitle').textContent=(all.find(n=>n.r===state.route.split('?')[0])||all.find(n=>n.r===base)||{label:'首頁'}).label;

  document.querySelectorAll('#view [data-act]').forEach(el=>{
    const act=el.dataset.act;
    if (act==='tripKind'){ el.onchange=()=>{ document.getElementById('tripFields').innerHTML=tripFieldsHtml(el.value); }; return; }
    if (act==='leaveType'){ el.onchange=()=>{ document.getElementById('attHint').innerHTML=attHintHtml(el.value); };
      const h=document.getElementById('attHint'); if(h&&!h.innerHTML) h.innerHTML=attHintHtml(el.value); return; }
    el.onclick=ev=>{
      if (act==='quick'){ doLogin(el.dataset.u, PW); }
      if (act==='punch'){ DB.punches.push({ emp:state.uid, type:el.dataset.type, ts:`${ymd(TODAY)}T${pad(TODAY.getHours())}:${pad(TODAY.getMinutes())}` });
        flash=`✅ ${el.textContent.trim()} 完成 · ${pad(TODAY.getHours())}:${pad(TODAY.getMinutes())}`; render(); }
      if (act==='cancelLeave'){ const l=DB.leaves.find(x=>x.id===+el.dataset.id); l.status='CANCELLED'; l.steps.forEach(s=>{if(s.st==='PENDING')s.st='REJECTED';}); flash='已取消申請'; render(); }
      if (act==='decide'){ decide(el.dataset.kind,+el.dataset.id,el.dataset.do); }
    };
  });

  document.querySelectorAll('#view [data-form]').forEach(form=>{
    if (form.dataset.form==='trip'){ const tf=document.getElementById('tripFields'); if(tf&&!tf.innerHTML) tf.innerHTML=tripFieldsHtml('TRIP'); }
    form.onsubmit=ev=>{
      ev.preventDefault();
      const fd=readForm(form), k=form.dataset.form;
      if (k==='login') doLogin(fd.username, fd.password);
      else if (k==='leave') submitLeave(fd, form);
      else if (k==='overtime') submitOvertime(fd);
      else if (k==='trip') submitTrip(fd);
      else if (k==='staff') saveStaff(fd, form.dataset.id?+form.dataset.id:null);
      else if (k==='payroll') location.hash=`#/payroll?e=${fd.e}&y=${fd.y}&m=${fd.m}`;
      else if (k==='reports') location.hash=`#/reports?y=${fd.y}&m=${fd.m}`;
    };
  });
}
function render(){
  if (state.uid && !me()){ state.uid=null; store.set(null); }   // 帳號已不存在 → 回登入
  document.body.classList.toggle('anon', !state.uid);
  if (!state.uid){ document.getElementById('view').innerHTML=V.login(); bind(); return; }
  buildNav();
  const key=state.route.split('?')[0];
  const view=V[key]||V[key.split('/')[0]]||V.dashboard;
  const f=flash; flash='';
  document.getElementById('view').innerHTML=(f?`<div class="flash">${esc(f)}</div>`:'')+view();
  bind();
  window.scrollTo(0,0);
}
function doLogin(u,p){
  const e=EMP.find(x=>x.username===String(u||'').trim().toLowerCase());
  if (!e || p!==PW) return errMsg('帳號或密碼錯誤（示範密碼：'+PW+'）');
  state.uid=e.id; store.set(e.id);
  state.route='dashboard'; location.hash='#/dashboard';
  flash=`👋 歡迎，${e.name}`; render();
}

document.getElementById('logoutBtn').onclick=()=>{ state.uid=null; store.set(null); location.hash=''; render(); };
window.addEventListener('hashchange',()=>{ state.route=location.hash.slice(2)||'dashboard'; render(); });

const themeBtn=document.getElementById('themeBtn');
const applyTheme=t=>{ t?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme'); };
try { const s=localStorage.getItem('gv-theme'); if(s) applyTheme(s); } catch(e){}
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const mqDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur==='dark'?'light':cur==='light'?'dark':(mqDark?'light':'dark');
  applyTheme(next); try{ localStorage.setItem('gv-theme',next); }catch(e){}
};

render();
</script>
